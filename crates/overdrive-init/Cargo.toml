# `overdrive-init` — the in-guest PID 1 agent for the Cloud Hypervisor VM
# driver (ADR-0082 §D7, GH #42). Class `binary`: a static, standalone
# executable the operator bakes into their BYO ext4 rootfs (per
# ADR-0082's "Negative, and stated" consequences — the platform ships the
# artifact and the wire contract, not the image; GH #259's OCI/Dockerfile
# -> rootfs factory does the baking, out of this feature's scope). Not a
# library any other crate imports.
#
# Target: static `{x86_64,aarch64}-unknown-linux-musl` (ADR-0082 §D7 /
# §D1). This step compiles against the workspace's default target for
# `cargo check`/`cargo nextest run` — the crate's production logic does
# not depend on musl-specific behaviour, only on `std` + `nix`, both of
# which support the musl targets as Tier 1/2 Rust targets. Step 01-04
# registered the two musl targets in `rust-toolchain.toml` (rustup
# auto-installs them) and cross-builds this crate at Tier-3 RUNTIME via
# `overdrive-testing::vm_fixture::build_overdrive_init_static` — the
# musl compile itself was validated on the metal box 2026-08-13 (`cargo
# xtask metal run -- cargo check -p overdrive-init --target
# x86_64-unknown-linux-musl --release`, clean in 8s). The first CI job
# that actually exercises the musl BUILD+LINK (not just `cargo check`)
# is step 01-06's real-Cloud-Hypervisor-boot job — that is where this
# crate's musl cross-compile is first CI-gated, not here.

[package]
name        = "overdrive-init"
version     = "0.0.0"
description = "In-guest PID 1: beacons ready over vsock, execs the operator's command, reports the real exit status, honors at most one SHUTDOWN."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
publish                = false

[package.metadata.overdrive]
crate_class = "binary"

[[bin]]
name = "overdrive-init"
path = "src/main.rs"

[features]
# Workspace-wide convention (`.claude/rules/testing.md` § "Integration
# vs unit gating" -> "Workspace convention") — every member declares
# this even with no integration-tests-gated surface of its own, so
# `cargo {check,test,mutants} --features integration-tests` resolves
# uniformly under per-package scoping. No-op here: this crate is
# exercised for real only via a genuine guest boot (Tier-3, step 01-08),
# which is `overdrive-host`/`overdrive-cli`'s `kvm-tests` gate, not a
# gate on this crate.
integration-tests = []

[dependencies]
overdrive-core.workspace = true
thiserror.workspace      = true
# `nix` — safe Rust bindings to the `AF_VSOCK` socket family (the vsock
# beacon connection), `mount(2)` for PID 1's procfs bootstrap, safe
# interface enumeration, the `reboot(2)` syscall (`RB_POWER_OFF` once
# the beacon session ends), and `finit_module(2)` (loading the guest
# vsock transport modules before dialing the beacon, ADR-0082 §D4
# amendment 2026-08-14 / DWD-21 — see `main.rs`'s
# `load_vsock_modules`). No separate "vsock" Cargo feature exists in
# nix 0.29 — `VsockAddr` lives under the workspace-inherited "socket"
# feature, cfg-gated internally to `linux_android`/`apple_targets`.
# The crate denies unsafe code by default and locally allows only the
# Linux networking ioctl calls with explicit SAFETY justifications.
# `std::process::Command` (not nix's raw `fork`/`exec`) spawns the
# operator's command — see `main.rs`'s module doc for why.
nix = { workspace = true, features = ["reboot", "kmod", "mount"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
