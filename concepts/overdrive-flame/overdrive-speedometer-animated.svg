<svg xmlns="http://www.w3.org/2000/svg" class="od-logo" viewBox="0 0 176 160" fill="#ff5c28" role="img" aria-label="Overdrive: a flaming speedometer">
  <title>Overdrive — flaming speedometer</title>
  <desc>An orange speedometer separated from sweeping flames by three dark bars. Six flame poses and a revving needle animate; reduced-motion preferences are respected.</desc>
  <style>
    .od-logo .od-flame { opacity: 0; animation: od-fire .9s steps(1, end) infinite; animation-delay: calc(var(--od-phase, 0s) + var(--od-offset, 0s)); animation-play-state: var(--od-play, running); }
    .od-logo .od-flame-first { opacity: 1; }
    .od-logo .od-needle { transform-origin: 113px 106px; transform: rotate(42deg); animation: od-rev 2.7s cubic-bezier(.45, 0, .25, 1) infinite; }
    .od-logo[data-motion="scroll"] .od-needle,
    .od-logo[data-motion="still"] .od-needle { animation: none; transform: rotate(var(--od-angle, 42deg)); }
    .od-logo[data-motion="scroll"],
    .od-logo[data-motion="still"] { --od-play: paused; }
    @keyframes od-fire { 0%, 16.666% { opacity: 1; } 16.667%, 100% { opacity: 0; } }
    @keyframes od-rev { 0%, 100% { transform: rotate(-54deg); } 38% { transform: rotate(54deg); } 48% { transform: rotate(47deg); } 60% { transform: rotate(61deg); } 70% { transform: rotate(56deg); } }
    @media (prefers-reduced-motion: reduce) {
      .od-logo .od-flame { animation: none; opacity: 0; }
      .od-logo .od-flame-first { opacity: 1; }
      .od-logo .od-needle { animation: none; transform: rotate(42deg) !important; }
    }
  </style>
