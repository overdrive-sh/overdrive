<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11110f">
    <meta name="description" content="A hover study for the Overdrive impeller mark.">
    <title>Overdrive / Hover study</title>
    <link rel="stylesheet" href="style.css">
    <script src="hover.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">OVERDRIVE / HOVER STUDY</p>
      <a class="back-link" href="../overdrive-intake/index.html">Scroll version</a>
    </header>

    <main class="study">
      <section class="demo" aria-labelledby="demo-title">
        <button
          class="hover-logo"
          type="button"
          aria-label="Spin the Overdrive impeller"
          aria-describedby="demo-title demo-instructions"
        >
          <img
            class="impeller"
            src="../logo-directions/impeller.png"
            alt=""
            aria-hidden="true"
          >
        </button>

        <div class="demo-copy">
          <h1 id="demo-title">Hover to spool up.</h1>
          <p id="demo-instructions">Hold to build speed. Move away to let it coast.</p>
        </div>
      </section>
    </main>
  </body>
</html>
