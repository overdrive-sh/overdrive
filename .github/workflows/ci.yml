  # -------------------------------------------------------------------
  # bpf-build — Phase 2.1 kernel-side ELF compilation.
  #
  # Per devops/ci-cd-pipeline.md §2.1 + ADR-0038 §3, §4. Runs
  # `cargo xtask bpf-build` to produce `target/bpf/overdrive_bpf.o`,
  # the artifact every downstream BPF test job consumes.
  #
  # Runs NATIVELY on the host runner — NOT in Lima. The BPF build is a
  # pure `bpfel-unknown-none` cross-compile: it runs nothing and needs
  # no kernel, KVM, or QEMU. Wrapping it in a Lima VM only dragged in
  # `lima-vm/lima-actions/setup`'s apt-based `apt-get install
  # qemu-system-x86`, which repeatedly hung against GitHub's background
  # apt-daily and burned the whole 20-minute budget of this LINCHPIN job
  # (every downstream BPF job `needs: bpf-build`), cancelling the entire
  # pipeline. That failure class is deleted by building on the host: no
  # QEMU install, no Lima disk cache, no lima-actions.  See the branch
  # history for the two prior band-aids (free-apt-lock, dpkg-lock wait)
  # that did not hold.
  #
  # `OVERDRIVE_BPF_NATIVE=1` tells `cargo xtask {bpf-build,bpf-clippy}`
  # to compile here instead of re-dispatching into Lima (the transparent
  # dev-surface default). Toolchain provisioning mirrors
  # infra/lima/overdrive-dev.yaml and MUST stay in lockstep with
  # xtask::BPF_NIGHTLY_TOOLCHAIN:
  #   - the pinned dated nightly (bpf-linker's LLVM lags rustc nightly's
  #     LLVM major bumps — see that constant's doc comment)
  #   - `rust-src` (the `-Z build-std=core` build rebuilds `core`)
  #   - `clippy` (bpf-clippy lints the `#![no_std] #![no_main]` bin)
  #   - LLVM 22 via apt.llvm.org (bpf-linker links it; matches the
  #     nightly's LLVM 22.1.8), then bpf-linker 0.10.4 via `cargo install
  #     --locked --version 0.10.4` (--locked mandatory per ADR-0038 §4;
  #     0.10.4 is the last llvm-22 release — 0.11.0 moved to llvm-23,
  #     which would skew against the LLVM-22 nightly). Recipe verified
  #     against ubuntu:24.04 (== ubuntu-latest) producing a valid
  #     bpfel-unknown-none ELF.
  # -------------------------------------------------------------------
  bpf-build:
    name: bpf-build
    runs-on: ubuntu-latest
    # Native cold build (toolchain + LLVM 22 + build-std core +
    # bpf-linker) is a few minutes; warm cache is under one. 20m is a
    # generous safety net.
    timeout-minutes: 20
    env:
      OVERDRIVE_BPF_NATIVE: "1"
      # Non-interactive apt for the LLVM-22 + mold installs below
      # (apt.llvm.org's llvm.sh drives apt-get) so a debconf/needrestart
      # TTY prompt cannot hang the step.
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      # The apt calls in this job are the LLVM-22 install and the mold
      # install below. Mask apt-daily / free the dpkg lock up front so
      # they cannot block on GitHub's background apt-daily — the
      # contention that hung the old Lima QEMU install and, on
      # 2026-08-19, the mold install. The hardened action (mask the
      # units, wait for — never SIGKILL — an in-flight transaction,
      # `dpkg --configure -a`, DPkg::Lock::Timeout) is what makes the
      # mold install below race-proof. Best-effort; never fails the job.
      - name: Free apt/dpkg lock (avoid LLVM/mold apt install hang)
        uses: ./.github/actions/free-apt-lock

      - name: Install pinned BPF nightly toolchain (+ rust-src, clippy)
        # Keep the toolchain date in lockstep with
        # xtask::BPF_NIGHTLY_TOOLCHAIN and infra/lima/overdrive-dev.yaml.
        run: |
          rustup toolchain install nightly-2026-08-05 \
            --component rust-src --component clippy --profile minimal

      # mold is the linker per .cargo/config.toml for the host triple
      # (`-fuse-ld=mold` on x86_64-unknown-linux-gnu). The kernel-side
      # ELF is linked by bpf-linker, but this job's host-target compiles
      # — xtask, the aya-ebpf proc-macros, bpf-linker itself — link with
      # mold, and ubuntu-latest does not ship it. Setting
      # CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="" does NOT strip
      # the flag (Cargo ignores an empty-string env override, so the
      # config-file `-fuse-ld=mold` still reaches the linker and the link
      # fails with `collect2: cannot find 'ld'`), so mold must be present.
      # free-apt-lock above makes this install race-proof.
      - name: Install mold linker
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mold

      - name: Cache cargo target + ~/.cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "phase-2-bpf-build"

      # bpf-linker links LLVM and MUST match the pinned nightly's LLVM
      # major (nightly-2026-08-05 == LLVM 22.1.8). apt.llvm.org's current
      # stable is LLVM 22 — a dedicated repo, NOT the flaky apt-daily
      # surface that hung the old QEMU install. free-apt-lock above has
      # already disabled apt-daily for this job.
      - name: Install LLVM 22 (bpf-linker link target; matches the nightly)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 22

      - name: Install bpf-linker
        # Pinned to 0.10.4 — the last release on the `llvm-22` feature
        # (0.11.0 moved to llvm-23, which skews against the LLVM-22
        # nightly and fails to build without LLVM 23). `--locked` is
        # mandatory per ADR-0038 §4. LLVM_PREFIX points bpf-linker's
        # build at the apt.llvm.org LLVM 22. `~/.cargo/bin` is restored
        # by rust-cache above, so this is a fast no-op on a warm cache.
        env:
          LLVM_PREFIX: /usr/lib/llvm-22
        run: cargo install --locked --version 0.10.4 bpf-linker

      - name: cargo xtask bpf-clippy
        # Lints the kernel-side `#![no_std] #![no_main]` bin under
        # `+nightly-2026-08-05 --target bpfel-unknown-none -Z
        # build-std=core --features build-bpf-target`. The host workspace
        # clippy job cannot cover this bin (rustc rejects it on the host
        # triple). OVERDRIVE_BPF_NATIVE keeps it on the host.
        run: cargo xtask bpf-clippy

      - name: cargo xtask bpf-build
        # Cross-compiles crates/overdrive-bpf to bpfel-unknown-none and
        # copies the ELF to the stable path target/bpf/overdrive_bpf.o
        # (ADR-0038 §3) that the downstream artifact upload publishes.
        run: cargo xtask bpf-build

      - name: Upload BPF object artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpf-object
          path: target/bpf/overdrive_bpf.o
          retention-days: 14
          # if-no-files-found: error is load-bearing — without it a
          # missing artifact silently no-ops and the downstream job
          # fails with a confusing surface.
          if-no-files-found: error

  # -------------------------------------------------------------------
  # bpf-unit — Phase 2.1 Tier 2 BPF unit tests.
  #
  # Per devops/ci-cd-pipeline.md §2.2 + .claude/rules/testing.md §Tier 2.
  # Runs `cargo xtask bpf-unit` (which invokes `cargo nextest run -p
  # overdrive-bpf --features integration-tests --test '*'`) against the
  # PKTGEN/SETUP/CHECK triptych. Asserts via `BPF_PROG_TEST_RUN` that
  # the no-op xdp_pass program returns XDP_PASS and the LruHashMap
  # counter increments 0 → 1.
  #
  # Capability requirement (per upstream-issues.md §A2): Ubuntu 22.04+
  # ships `kernel.unprivileged_bpf_disabled = 2`, which makes
  # `BPF_PROG_LOAD` (called before `BPF_PROG_TEST_RUN`) fail with EPERM
  # for unprivileged users. The cargo xtask bpf-unit step runs under
  # `sudo` to provide CAP_BPF. Locally, `cargo xtask lima run -- cargo
  # xtask bpf-unit` does the same via the canonical Lima wrapper.
  # Earlier docs at ci-cd-pipeline.md §2.2 claimed otherwise; see
  # upstream-issues.md §A2 for the empirical correction.
  # -------------------------------------------------------------------
  bpf-unit:
    name: bpf-unit
    runs-on: ubuntu-latest
    needs: bpf-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Free the dpkg lock before the third-party Lima setup runs its
      # `apt-get install ... qemu-system-x86`. Without this, GitHub's
      # background apt-daily holds the lock and the install blocks until the
      # job timeout — the recurring bpf-build cancellation. See the action.
      - name: Free apt/dpkg lock (avoid QEMU install hang)
        uses: ./.github/actions/free-apt-lock

      - name: Install Lima
        uses: lima-vm/lima-actions/setup@v1

      - name: Cache Lima VM
        id: lima-cache
        uses: actions/cache@v4
        with:
          path: ~/.lima/overdrive
          key: lima-${{ hashFiles('infra/lima/overdrive-dev.yaml') }}-${{ runner.arch }}

      - name: Provision Lima VM (cache miss)
        if: steps.lima-cache.outputs.cache-hit != 'true'
        run: limactl start --timeout=30m --name=overdrive --tty=false infra/lima/overdrive-dev.yaml

      - name: Start cached Lima VM
        if: steps.lima-cache.outputs.cache-hit == 'true'
        run: limactl start --timeout=30m overdrive

      - name: Download BPF object artifact
        uses: actions/download-artifact@v4
        with:
          name: bpf-object
          path: target/bpf/
          if-no-files-found: error

      - id: sccache-setup
        name: Setup sccache (soft-fail on cache backend outage)
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache when setup succeeded
        if: steps.sccache-setup.outcome == 'success'
        # The action reports `success` even when the underlying GHA cache
        # backend is unreachable (no ACTIONS_*_URL exported to GITHUB_ENV).
        # If we forwarded RUSTC_WRAPPER=sccache into the build with an
        # empty URL, sccache would refuse to start ("cache url for ghac
        # not found") and every rustc invocation — including rustup's
        # toolchain verification probe — would exit 2. Guard explicitly:
        # require at least one of ACTIONS_CACHE_URL (v1 backend) or
        # ACTIONS_RESULTS_URL (v2 backend, post-Feb-2025) to be set
        # before flipping the wrapper on.
        run: |
          if [ -n "${ACTIONS_CACHE_URL:-}" ] || [ -n "${ACTIONS_RESULTS_URL:-}" ]; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache-action reported success but neither ACTIONS_CACHE_URL nor ACTIONS_RESULTS_URL is set; building without compiler cache."
          fi

      - name: Warn when sccache unavailable
        if: steps.sccache-setup.outcome != 'success'
        run: echo "::warning::sccache setup failed; building without compiler cache. Expected during GHA cache backend outages."

      - name: cargo xtask bpf-unit
        # CAP_BPF is required; the Lima VM's `xtask lima run` wrapper
        # provides root via `sudo -E`. The xtask `bpf_unit()` function
        # calls `ensure_in_lima()` which detects the VM and proceeds
        # directly.
        run: |
          limactl shell overdrive env \
            "RUSTC_WRAPPER=${RUSTC_WRAPPER:-}" \
            "SCCACHE_GHA_ENABLED=${SCCACHE_GHA_ENABLED:-}" \
            "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL:-}" \
            "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-}" \
            "ACTIONS_CACHE_SERVICE_V2=${ACTIONS_CACHE_SERVICE_V2:-}" \
            "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN:-}" \
            bash -lc 'sudo -E env "HOME=$HOME" "PATH=$PATH" "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" \
                      "RUSTC_WRAPPER=$RUSTC_WRAPPER" \
                      "SCCACHE_GHA_ENABLED=$SCCACHE_GHA_ENABLED" \
                      "ACTIONS_CACHE_URL=$ACTIONS_CACHE_URL" \
                      "ACTIONS_RESULTS_URL=$ACTIONS_RESULTS_URL" \
                      "ACTIONS_CACHE_SERVICE_V2=$ACTIONS_CACHE_SERVICE_V2" \
                      "ACTIONS_RUNTIME_TOKEN=$ACTIONS_RUNTIME_TOKEN" \
                      cargo xtask bpf-unit'

      - name: Show sccache stats
        if: always() && steps.sccache-setup.outcome == 'success'
        run: |
          limactl shell overdrive bash -lc 'sccache --show-stats' || true

      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpf-unit-junit
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Stop Lima VM (release disk before cache save)
        if: always()
        timeout-minutes: 1
        run: limactl stop --force overdrive || true

  # -------------------------------------------------------------------
  # Job E (Tier 4) — verifier-budget regression gate
  # -------------------------------------------------------------------
  # `cargo verifier-regress` (alias resolves to
  # `cargo run -p overdrive-dataplane --bin verifier_regress`) loads
  # the compiled BPF object via aya, reads each program's
  # `ProgramInfo::verified_instruction_count` (kernel ≥5.16
  # `bpf_prog_info.verified_insns`), and fails the PR if any program
  # exceeds its baseline at `perf-baseline/main/verifier-budget/` by
  # >5%, or approaches the per-program 1M CAP_BPF complexity ceiling
  # by >10%.
  #
  # # Why aya, not veristat
  #
  # libbpf 1.0+ removed the legacy `SEC("maps")` parser; aya 0.13.x
  # still emits maps in that legacy section, so libbpf-linked tools
  # (veristat, bpftool) refuse to load aya ELFs. The signal we want
  # — `bpf_prog_info.verified_insns` — is the same field veristat
  # surfaces as `TOTAL_INSNS`; reading it via aya bypasses libbpf
  # entirely. Tracking aya issue #913.
  #
  # Pure-Rust gate logic self-tested by `cargo nextest run -p
  # overdrive-dataplane` (unit tests in
  # `crates/overdrive-dataplane/src/verifier_budget.rs`); this job
  # runs the gate against the real BPF object. See
  # `.claude/rules/testing.md` § "Tier 4 — Verifier and Performance
  # Gates".
  verifier-regress:
    name: cargo verifier-regress
    runs-on: ubuntu-latest
    needs: bpf-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Free the dpkg lock before the third-party Lima setup runs its
      # `apt-get install ... qemu-system-x86`. Without this, GitHub's
      # background apt-daily holds the lock and the install blocks until the
      # job timeout — the recurring bpf-build cancellation. See the action.
      - name: Free apt/dpkg lock (avoid QEMU install hang)
        uses: ./.github/actions/free-apt-lock

      - name: Install Lima
        uses: lima-vm/lima-actions/setup@v1

      - name: Cache Lima VM
        id: lima-cache
        uses: actions/cache@v4
        with:
          path: ~/.lima/overdrive
          key: lima-${{ hashFiles('infra/lima/overdrive-dev.yaml') }}-${{ runner.arch }}

      - name: Provision Lima VM (cache miss)
        if: steps.lima-cache.outputs.cache-hit != 'true'
        run: limactl start --timeout=30m --name=overdrive --tty=false infra/lima/overdrive-dev.yaml

      - name: Start cached Lima VM
        if: steps.lima-cache.outputs.cache-hit == 'true'
        run: limactl start --timeout=30m overdrive

      - name: Download BPF object artifact
        uses: actions/download-artifact@v4
        with:
          name: bpf-object
          path: target/bpf/
          if-no-files-found: error

      - id: sccache-setup
        name: Setup sccache (soft-fail on cache backend outage)
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache when setup succeeded
        if: steps.sccache-setup.outcome == 'success'
        # The action reports `success` even when the underlying GHA cache
        # backend is unreachable (no ACTIONS_*_URL exported to GITHUB_ENV).
        # If we forwarded RUSTC_WRAPPER=sccache into the build with an
        # empty URL, sccache would refuse to start ("cache url for ghac
        # not found") and every rustc invocation — including rustup's
        # toolchain verification probe — would exit 2. Guard explicitly:
        # require at least one of ACTIONS_CACHE_URL (v1 backend) or
        # ACTIONS_RESULTS_URL (v2 backend, post-Feb-2025) to be set
        # before flipping the wrapper on.
        run: |
          if [ -n "${ACTIONS_CACHE_URL:-}" ] || [ -n "${ACTIONS_RESULTS_URL:-}" ]; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache-action reported success but neither ACTIONS_CACHE_URL nor ACTIONS_RESULTS_URL is set; building without compiler cache."
          fi

      - name: Warn when sccache unavailable
        if: steps.sccache-setup.outcome != 'success'
        run: echo "::warning::sccache setup failed; building without compiler cache. Expected during GHA cache backend outages."

      - name: cargo verifier-regress
        run: |
          limactl shell overdrive env \
            "RUSTC_WRAPPER=${RUSTC_WRAPPER:-}" \
            "SCCACHE_GHA_ENABLED=${SCCACHE_GHA_ENABLED:-}" \
            "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL:-}" \
            "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-}" \
            "ACTIONS_CACHE_SERVICE_V2=${ACTIONS_CACHE_SERVICE_V2:-}" \
            "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN:-}" \
            bash -lc 'sudo -E env "HOME=$HOME" "PATH=$PATH" "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" \
                      "RUSTC_WRAPPER=$RUSTC_WRAPPER" \
                      "SCCACHE_GHA_ENABLED=$SCCACHE_GHA_ENABLED" \
                      "ACTIONS_CACHE_URL=$ACTIONS_CACHE_URL" \
                      "ACTIONS_RESULTS_URL=$ACTIONS_RESULTS_URL" \
                      "ACTIONS_CACHE_SERVICE_V2=$ACTIONS_CACHE_SERVICE_V2" \
                      "ACTIONS_RUNTIME_TOKEN=$ACTIONS_RUNTIME_TOKEN" \
                      cargo run -p overdrive-dataplane --bin verifier_regress'

      - name: Show sccache stats
        if: always() && steps.sccache-setup.outcome == 'success'
        run: |
          limactl shell overdrive bash -lc 'sccache --show-stats' || true

      - name: Stop Lima VM (release disk before cache save)
        if: always()
        timeout-minutes: 1
        run: limactl stop --force overdrive || true

  # -------------------------------------------------------------------
  # Job E (Tier 4) — XDP throughput / mean-latency regression gate
  # -------------------------------------------------------------------
  # `cargo xdp-perf` (binary at
  # `crates/overdrive-dataplane/bin/xdp_perf.rs`) loads each
  # XDP program named in `perf-baseline/main/xdp-perf/*.txt` via
  # aya, runs each in-kernel via `BPF_PROG_TEST_RUN` with
  # `repeat=N`, then reads `bpf_prog_info.run_time_ns` / `run_cnt`
  # (gated on `aya::sys::enable_stats(Stats::RunTime)`, kernel ≥5.8)
  # to compute pps + mean_ns. Fails the PR if pps regresses by >5%
  # or mean_ns rises by >10% vs the recorded baseline. Pure gate
  # logic self-tested via `cargo nextest run -p overdrive-dataplane
  # --lib -E 'test(xdp_perf_gate)'`. See
  # `.claude/rules/testing.md` § "Tier 4 — Verifier and Performance
  # Gates".
  xdp-perf:
    name: cargo xdp-perf
    runs-on: ubuntu-latest
    needs: bpf-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Free the dpkg lock before the third-party Lima setup runs its
      # `apt-get install ... qemu-system-x86`. Without this, GitHub's
      # background apt-daily holds the lock and the install blocks until the
      # job timeout — the recurring bpf-build cancellation. See the action.
      - name: Free apt/dpkg lock (avoid QEMU install hang)
        uses: ./.github/actions/free-apt-lock

      - name: Install Lima
        uses: lima-vm/lima-actions/setup@v1

      - name: Cache Lima VM
        id: lima-cache
        uses: actions/cache@v4
        with:
          path: ~/.lima/overdrive
          key: lima-${{ hashFiles('infra/lima/overdrive-dev.yaml') }}-${{ runner.arch }}

      - name: Provision Lima VM (cache miss)
        if: steps.lima-cache.outputs.cache-hit != 'true'
        run: limactl start --timeout=30m --name=overdrive --tty=false infra/lima/overdrive-dev.yaml

      - name: Start cached Lima VM
        if: steps.lima-cache.outputs.cache-hit == 'true'
        run: limactl start --timeout=30m overdrive

      - name: Download BPF object artifact
        uses: actions/download-artifact@v4
        with:
          name: bpf-object
          path: target/bpf/
          if-no-files-found: error

      - id: sccache-setup
        name: Setup sccache (soft-fail on cache backend outage)
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache when setup succeeded
        if: steps.sccache-setup.outcome == 'success'
        # The action reports `success` even when the underlying GHA cache
        # backend is unreachable (no ACTIONS_*_URL exported to GITHUB_ENV).
        # If we forwarded RUSTC_WRAPPER=sccache into the build with an
        # empty URL, sccache would refuse to start ("cache url for ghac
        # not found") and every rustc invocation — including rustup's
        # toolchain verification probe — would exit 2. Guard explicitly:
        # require at least one of ACTIONS_CACHE_URL (v1 backend) or
        # ACTIONS_RESULTS_URL (v2 backend, post-Feb-2025) to be set
        # before flipping the wrapper on.
        run: |
          if [ -n "${ACTIONS_CACHE_URL:-}" ] || [ -n "${ACTIONS_RESULTS_URL:-}" ]; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache-action reported success but neither ACTIONS_CACHE_URL nor ACTIONS_RESULTS_URL is set; building without compiler cache."
          fi

      - name: Warn when sccache unavailable
        if: steps.sccache-setup.outcome != 'success'
        run: echo "::warning::sccache setup failed; building without compiler cache. Expected during GHA cache backend outages."

      # The Lima VM has the full toolchain. Needs `CAP_SYS_ADMIN` for
      # `enable_stats(RunTime)` — the default `sudo -E` wrapper inside
      # the VM provides it.
      - name: cargo xdp-perf
        run: |
          limactl shell overdrive env \
            "RUSTC_WRAPPER=${RUSTC_WRAPPER:-}" \
            "SCCACHE_GHA_ENABLED=${SCCACHE_GHA_ENABLED:-}" \
            "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL:-}" \
            "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-}" \
            "ACTIONS_CACHE_SERVICE_V2=${ACTIONS_CACHE_SERVICE_V2:-}" \
            "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN:-}" \
            bash -lc 'sudo -E env "HOME=$HOME" "PATH=$PATH" "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" \
                      "RUSTC_WRAPPER=$RUSTC_WRAPPER" \
                      "SCCACHE_GHA_ENABLED=$SCCACHE_GHA_ENABLED" \
                      "ACTIONS_CACHE_URL=$ACTIONS_CACHE_URL" \
                      "ACTIONS_RESULTS_URL=$ACTIONS_RESULTS_URL" \
                      "ACTIONS_CACHE_SERVICE_V2=$ACTIONS_CACHE_SERVICE_V2" \
                      "ACTIONS_RUNTIME_TOKEN=$ACTIONS_RUNTIME_TOKEN" \
                      cargo xdp-perf'

      - name: Show sccache stats
        if: always() && steps.sccache-setup.outcome == 'success'
        run: |
          limactl shell overdrive bash -lc 'sccache --show-stats' || true

      - name: Stop Lima VM (release disk before cache save)
        if: always()
        timeout-minutes: 1
        run: limactl stop --force overdrive || true

