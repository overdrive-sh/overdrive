[[check]]
name = "identity-run-restart-reissue"
spec = "gateway_identity.qnt"
main = "identity_conf"
run = "restart_reissue"
backend = "evaluator"
expect = "holds"
ci = true

# ADR-0225: the one hazard of the decision
[[check]]
name = "identity-hazard-no-epoch-check"
spec = "hazard/gateway_identity_hazards.qnt"
main = "identity_bugNoEpochCheck"
invariant = "StaleEpochNeverHolds"
backend = "tlc"
expect = "violation"
ci = true

