# Checks the `cargo xtask quint` runner executes for specs/quint/public-ingress-gateway/.
# `expect = "violation"` on a hazard instance means the decision's rule is load-bearing; every other check must hold.
# Modules: gateway_identity (ADR-0225), gateway_application (ADR-0222), selection_receipt (ADR-0228, -0232, -0233,
# -0241, -0243). Validation budget: 21 checks (3 TLC safety, 5 TLC hazards, 13 named runs); only receipt-safety-tlc is slow (about 900 s, non-CI).

# ==== gateway_identity.qnt

[[check]]
name = "identity-safety-tlc"
spec = "gateway_identity.qnt"
main = "identity_ok"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "identity-run-issue-hold"
spec = "gateway_identity.qnt"
main = "identity_conf"
run = "issue_hold"
backend = "evaluator"
expect = "holds"
ci = true

[[check]]
name = "identity-run-reissue-near-expiry"
spec = "gateway_identity.qnt"
main = "identity_conf"
run = "reissue_near_expiry"
backend = "evaluator"
expect = "holds"
ci = true

[[check]]
name = "identity-run-disable-races-inflight-issue"
spec = "gateway_identity.qnt"
main = "identity_conf"
run = "disable_races_inflight_issue"
backend = "evaluator"
expect = "holds"
ci = true

[[check]]
name = "identity-run-audit-failure-no-hold"
spec = "gateway_identity.qnt"
main = "identity_conf"
run = "audit_failure_no_hold"
backend = "evaluator"
expect = "holds"
ci = true

[[check]]
name = "identity-run-restart-reissue"
spec = "gateway_identity.qnt"
main = "identity_conf"
run = "restart_reissue"
backend = "evaluator"
expect = "holds"
ci = true

# ADR-0225: the one hazard of the decision
[[check]]
name = "identity-hazard-no-epoch-check"
spec = "hazard/gateway_identity_hazards.qnt"
main = "identity_bugNoEpochCheck"
invariant = "StaleEpochNeverHolds"
backend = "tlc"
expect = "violation"
ci = true

