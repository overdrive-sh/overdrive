# Checks the `cargo xtask quint` runner executes for specs/quint/public-ingress-gateway/.
# `expect = "violation"` on a hazard instance means the decision's rule is load-bearing; every other check must hold.
# Modules: gateway_identity (ADR-0225), gateway_application (ADR-0222), selection_receipt (ADR-0232, -0233,
# -0241; context -0228, -0242; the connector ledger order is ADR-0248, not modelled) and relay_exchange (ADR-0239; context ADR-0245,
# -0246, -0247, -0253, -0254). The kTLS rekey exclusion (ADR-0244, -0249, -0250) is not modelled (ruling 19): the gateway
# never originates a KeyUpdate (ADR-0250), chunk framing is covered by property tests.
# VALIDATION BUDGET (single home): 35 checks = 4 TLC safety + 8 TLC hazards + 23 named runs. The relay module
# contributes 9. Only receipt-safety-tlc is slow (about 900 s, non-CI); every other check is under two minutes and
# `ci = true`. receipt-safety-tlc is the MANUAL pre-merge gate (not run in CI; run it by hand before merging a
# change to selection_receipt.qnt). Growth beyond these counts needs user approval.

# ==== gateway_identity.qnt

[[check]]
name = "identity-safety-tlc"
spec = "gateway_identity.qnt"
main = "identity_ok"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "identity-run-issue-hold"
spec = "gateway_identity.qnt"
main = "identity_conf"
run = "issue_hold"
backend = "evaluator"
expect = "holds"
ci = true

[[check]]
name = "identity-run-reissue-near-expiry"
