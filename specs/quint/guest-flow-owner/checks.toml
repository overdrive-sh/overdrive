# Half-close (HALFCLOSE-SIGNAL, ADR-0180): instance `flows_half` — one paired TCP flow (TcpConnect or
# TcpAccept, chosen at init), the flow vsock and the control session as independent channels, each owner
# able to die (its vsock end reaching the survivor as its own action, VsockEndReachesSurvivor), the
# session able to drop, flow errors (teardown, quiescence) and outer resets per side. Invariant 13:
# NoEofOnPeerLoss, FinOnlyAfterAck. Progress: HalfCloseCompletes (no fault), AnnounceEnds (faults
# included), EarlyEofCarried. Prediction: all hold

[[check]]
name = "owner-flows-half-no-eof-on-peer-loss"
spec = "owner_flows.qnt"
main = "flows_half"
invariant = "NoEofOnPeerLoss"
backend = "tlc"
expect = "holds"
ci = true

