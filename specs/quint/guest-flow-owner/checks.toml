# U-R1 (EVMOD-CTL recovery step 1, DR2-CLOSE): the recovery ends a held GuestStream whose watch already ended as an
# owner abort. Predicted: the design run holds; with the rule off, RecoveryEndsHeldStream is violated (a guest
