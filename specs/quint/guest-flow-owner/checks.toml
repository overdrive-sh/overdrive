# Checks the `cargo xtask quint` runner executes for specs/quint/guest-flow-owner/.
#
# Each [[check]] names one property of one instance (`main`) of one spec file (`spec`, relative to
# this directory). `invariant` = safety (state predicate); `temporal` = liveness (TLC only).
# backend "apalache" = bounded symbolic search to `max_steps`; "tlc" = exhaustive explicit-state
# search of the finite instance (no step bound).
# expect "holds" = the design property; "violation" = a non-vacuity witness (the behaviour is
# reachable), a hazard/teeth instance (one design rule switched off through OFF), or documented
# behaviour. Expectations are the design's claims; where the prediction written before the run
# differs, the comment above the check says so (round 9: the 2026-10-09 spike remediation and its
# round 2 — K-A2′, ATTR-TOKEN with ATTR-LIVE-CLAIM, the beacon and HALFCLOSE-SIGNAL in owner_flows,
# CELL-RECREATE in udp_slots, INTAKE-BIND in prefix_landing; earlier rounds' findings:
# docs/feature/netns-density-295/design/quint-guest-flow-owner-findings-r8.md and before).
# ci = true only for checks whose own time (the runner records it apart from start-up retries) is
# under 2 minutes on the Lima VM (`cargo xtask quint check`). Round 9: the module-A TLC liveness
# checks of the core instance (GuestHalfEnds, SessionBecomesLive) take 135-140 s, and the udp_slots
# exhaustive checks 300-810 s (cell generations and queued readiness events).


# Module A: control sessions, flow admission, launch attribution (ATTR-TOKEN), TcpAccept pairing (U-1, U-5).
# Invariants 1, 3, 4, 4+ (CurrentGeneration), ClosedIsTerminal, NoCrossLaunchMsg, NoCrossLaunchSessionHeld
[[check]]
name = "owner-flows-safety-tlc"
spec = "owner_flows.qnt"
main = "flows_ok"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "owner-flows-safety-apalache"
spec = "owner_flows.qnt"
main = "flows_ok"
invariant = "Safety"
backend = "apalache"
max_steps = 12
expect = "holds"
ci = false

