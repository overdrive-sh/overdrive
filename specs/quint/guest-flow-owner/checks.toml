max_steps = 14
expect = "violation"
ci = false

[[check]]
name = "owner-flows-hazard-no-abort-on-loss"
spec = "hazard/owner_flows_hazards.qnt"
main = "flows_bugNoAbortOnLoss"
invariant = "NoAdmitWhenClosed"
backend = "apalache"
max_steps = 14
expect = "violation"
ci = false

[[check]]
name = "owner-flows-hazard-late-paired-resurrects"
spec = "hazard/owner_flows_hazards.qnt"
main = "flows_bugLatePairedResurrects"
invariant = "ClosedIsTerminal"
backend = "apalache"
max_steps = 14
expect = "violation"
ci = false

# (ATTR-TOKEN, D18a) a provisioned launch whose guest keeps reconnecting eventually holds a live session.
# Checked on instance flows_sess (2 control connections, 2 launches; NO guest-opened flows, NO dial slots):
# the property mentions sessions only, and the full flows_ok instance (15.1M states) does not finish
# its liveness check in 900 s. The flow / dial parts do not gate session steps (session loss aborts them
# in the same atomic step), so removing them drops no session interleaving.
[[check]]
name = "owner-flows-session-becomes-live"
spec = "owner_flows.qnt"
main = "flows_sess"
temporal = "SessionBecomesLive"
backend = "tlc"
expect = "holds"
ci = true

# K-A5S dropped (environment variant): the guest owner never observes the end of the control connection it holds
# (D-UP-8: it re-opens only after observing the loss), so after the launch's session is refused or lost the launch
# never holds a live session again. Teeth for SessionBecomesLive, on its own instance flows_sess
[[check]]
name = "owner-flows-sess-env-guest-misses-session-loss"
spec = "hazard/owner_flows_session_hazards.qnt"
main = "flows_sess_envGuestMissesSessionLoss"
temporal = "SessionBecomesLive"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "owner-flows-hazard-peer-cid-only-message"
spec = "hazard/owner_flows_hazards.qnt"
main = "flows_bugPeerCidOnly"
invariant = "NoCrossLaunchMsg"
backend = "tlc"
expect = "violation"
ci = true

# Teeth (ATTR-LIVE-CLAIM): the CID state checked at accept only, the claim
# step comparing with the lease token (Retiring included). Its counterexample: a dead
# launch's queued control connection accepted while Provisioned and read after teardown takes the
# claim, which survives pool.release; the next lease's session is refused SessionHeld
[[check]]
name = "owner-flows-hazard-no-claim-recheck-held"
spec = "hazard/owner_flows_hazards.qnt"
main = "flows_bugNoClaimRecheck"
invariant = "NoCrossLaunchSessionHeld"
backend = "tlc"
expect = "violation"
ci = true

# Beacon (VM driver, port 1234; ADR-0157, ATTR-TOKEN, ATTR-LIVE-CLAIM): instance `flows_beacon`. READY is
# read, then compared with the live launch's token and the beacon claim taken in one step; driver.stop ends
# liveness, closes the beacon session and releases the claim in one step, before pool.release. Prediction:
# the three invariants and ReadyReleased hold
[[check]]
name = "owner-flows-beacon-current-launch"
spec = "owner_flows.qnt"
main = "flows_beacon"
invariant = "BeaconCurrentLaunch"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "owner-flows-beacon-no-cross-launch-ready"
spec = "owner_flows.qnt"
main = "flows_beacon"
invariant = "BeaconNoCrossLaunchReady"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "owner-flows-beacon-no-cross-launch-held"
spec = "owner_flows.qnt"
main = "flows_beacon"
invariant = "BeaconNoCrossLaunchHeld"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "owner-flows-beacon-ready-released"
spec = "owner_flows.qnt"
main = "flows_beacon"
temporal = "ReadyReleased"
backend = "tlc"
expect = "holds"
ci = true

