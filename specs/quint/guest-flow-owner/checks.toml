# Checks the `cargo xtask quint` runner executes for specs/quint/guest-flow-owner/.
#
# Each [[check]] names one property of one instance (`main`) of one spec file (`spec`, relative to
# this directory). `invariant` = safety (state predicate); `temporal` = liveness (TLC only).
# backend "apalache" = bounded symbolic search to `max_steps`; "tlc" = exhaustive explicit-state
# search of the finite instance (no step bound).
# expect "holds" = the design property; "violation" = a non-vacuity witness (the behaviour is
# reachable), a hazard/teeth instance (one design rule switched off), or an environment fault /
# documented limitation / accepted, bounded design behaviour. Expectations were written before the
# recorded runs (round 2: docs/feature/netns-density-295/spike/quint-owner-findings-r2.md; round 3,
# after the user decisions of 2026-10-06 on U-5/K-A4, D16-PREF and D8a-READMIT, and on the
# accepted exposures D8a-PROBE / D8a-FLUSH: quint-owner-findings-r3.md).
# ci = true only for checks measured under 2 minutes wall-clock on the Lima VM (`cargo xtask quint check`).


# Module A: control sessions, flow admission, TcpAccept pairing (U-1, U-5). Invariants 1, 3, 4, CurrentGeneration, ClosedIsTerminal
[[check]]
name = "owner-flows-safety-tlc"
spec = "owner_flows.qnt"
main = "flows_ok"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "owner-flows-safety-apalache"
spec = "owner_flows.qnt"
main = "flows_ok"
invariant = "Safety"
backend = "apalache"
max_steps = 12
expect = "holds"
ci = false

# U-5 + K-A4: a guest TcpAccept half (accepted, or still in the guest's accept queue) whose host side
