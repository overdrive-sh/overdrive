# ==== fwd_safe: the forwarder's pair lifecycle at its lock and RCU boundaries (EVMOD-SAFE, ADR-0204), the wakeups of
# § Forwarding (backpressure resumes), the end record (EVMOD-REC). Not a conformance target (module-internal C).
# Safety on safe_pair (a pair, FMAX 2) and safe_watch (a watch, FMAX 2); liveness on safe_plive / safe_wlive (FMAX 1);
# the named runs on safe_runs.

[[check]]
name = "fwd-safe-pair-safety-tlc"
spec = "fwd_safe.qnt"
main = "safe_pair"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "fwd-safe-watch-safety-tlc"
spec = "fwd_safe.qnt"
main = "safe_watch"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

# F-S1 (EVMOD-SWEEP, ADR-0180) as a hazard: the orphan sweep stores peer_shutdown before sk_err without the socket
# lock (drivers/vhost/vsock.c:747, :749 @ v7.0). Without the vsock_table_lock re-check, a run already queued reads
# end-of-stream with no class recorded and aborts Unclassified, firing the unclassified_eof alarm. Under the design
# NoUnclassifiedEnd is part of Safety (fwd-safe-pair-safety-tlc).

[[check]]
name = "fwd-safe-hazard-no-sweep-recheck"
spec = "hazard/fwd_safe_hazards.qnt"
main = "safe_bugNoSweepRecheck"
invariant = "NoUnclassifiedEnd"
backend = "tlc"
expect = "violation"
ci = true

