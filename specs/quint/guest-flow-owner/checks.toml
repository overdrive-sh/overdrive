# ==== fwd_pair: the in-kernel event-driven forwarder (EVMOD-ADOPT, ADR-0197; EVMOD-END, EVMOD-PAIR, EVMOD-CTL,
# EVMOD-DGRAM, EVMOD-AB): one guest flow end to end, forwarded on each side
# Safety on pair_ok (stream) and pair_watch (a dial), DgramSafety on pair_dgram, liveness on pair_live (and, for
# EV-DGRAM D1, EveryEndResolves on pair_dlive); the named
# runs on the conformance main pair_conf. Every model-checking instance carries at most one fault per trace (FMAX).

[[check]]
name = "fwd-pair-safety-tlc"
spec = "fwd_pair.qnt"
main = "pair_ok"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = false
timeout_secs = 2400

[[check]]
name = "fwd-pair-watch-safety-tlc"
spec = "fwd_pair.qnt"
main = "pair_watch"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = false

# The multi-unit, multi-datagram instance: stream mode with 2 units and datagram mode with 2
# datagrams, one direction, one fault per trace. MidSafety = Safety and DgramSafety.
[[check]]
name = "fwd-pair-mid-safety-tlc"
spec = "fwd_pair.qnt"
main = "pair_mid"
invariant = "MidSafety"
backend = "tlc"
expect = "holds"
ci = false
timeout_secs = 1800

# EVMOD-DGRAM off: a datagram consumed when only part of its frame was accepted (the teeth of the datagram invariants).
# The cut frame corrupts the frame of the datagram that follows it, so the instance carries three datagrams in one
# direction (`pair_dhaz`); with two (`pair_mid`) the hazard is not violated.
[[check]]
name = "fwd-pair-hazard-consume-partial-frame"
spec = "hazard/fwd_pair_hazards_4.qnt"
main = "pair_dhazConsumePartialFrame"
invariant = "DatagramsOnceInOrder"
backend = "tlc"
expect = "violation"
ci = false

[[check]]
name = "fwd-pair-dgram-safety-tlc"
spec = "fwd_pair.qnt"
main = "pair_dgram"
invariant = "DgramSafety"
backend = "tlc"
expect = "holds"
ci = false
timeout_secs = 2700

[[check]]
name = "fwd-pair-every-unit-delivered"
spec = "fwd_pair.qnt"
main = "pair_live"
temporal = "EveryUnitDelivered"
backend = "tlc"
expect = "holds"
ci = false
