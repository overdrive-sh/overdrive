# as its own check on the design instance (they are also inside `Safety`). The claim step compares the
# ControlOpen's token with the CID's LIVE token (Provisioned or Active) in the same step as the claim;
# teardown does not touch connections in `reading`. Prediction written before the run: all three hold
# (the round-9 first-run counterexample is closed at its read).

[[check]]
name = "owner-flows-current-launch-tlc"
spec = "owner_flows.qnt"
main = "flows_ok"
invariant = "CurrentGeneration"
backend = "tlc"
expect = "holds"
ci = true

