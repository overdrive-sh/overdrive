# Steering concern 4 — the shared nft table left partial by Overdrive (shared_table.qnt): K-D3,
# D8a-LOOKUP (steering independent of the table), D8a-HOLD (the IpRules recovery). Instances: table_ok
# (crash at any step, between step-8 batches included; the mTLS worker failing part-way at boot and at
# runtime, unbounded; listener-task exits; one repair failure), table_live (no crash; a repair may
# fail forever).
[[check]]
name = "shared-table-safety-tlc"
spec = "shared_table.qnt"
main = "table_ok"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "shared-table-live-safety-tlc"
spec = "shared_table.qnt"
main = "table_live"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "shared-table-safety-apalache"
spec = "shared_table.qnt"
main = "table_ok"
invariant = "Safety"
backend = "apalache"
max_steps = 12
expect = "holds"
ci = true

# Progress (D8a-HOLD, concern 4): the IpRules recovery's table repair completes under its hold — the
# table is complete again — or serve stops, under that recovery's own fairness (and boot) only. Round 5
# also checked "the leg-C bypass ends"; that holds trivially (the first quiesce closes every intake
# listener) and is no longer checked.
[[check]]
name = "shared-table-repaired"
spec = "shared_table.qnt"
main = "table_live"
temporal = "TableRepaired"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "shared-table-ok-repaired"
spec = "shared_table.qnt"
main = "table_ok"
temporal = "TableRepaired"
backend = "tlc"
expect = "holds"
ci = true

