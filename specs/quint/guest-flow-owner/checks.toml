# Checks the `cargo xtask quint` runner executes for specs/quint/guest-flow-owner/.
#
# Each [[check]] names one property of one instance (`main`) of one spec file (`spec`, relative to
# this directory). `invariant` = safety (state predicate); `temporal` = liveness (TLC only);
# `run` = a named scenario executed by `quint test` (backend "evaluator").
# backend "apalache" = bounded symbolic search to `max_steps`; "tlc" = exhaustive explicit-state
# search of the finite instance (no step bound).
# expect "holds" = the design property; "violation" = a non-vacuity witness (the behaviour is
# reachable), a hazard/teeth instance (one design rule switched off through OFF), or documented
# behaviour. For a run, "violation" = an `expect` along the replayed scenario fails under the
# weakened rule.
# ci (DR6-CLOSE rule): ci = true iff the check's own time (`Seconds`, start-up retries excluded) in the
# latest full record is under 60 s — half the two-minute limit of .claude/rules/design.md, absorbing the
# run-to-run variance of a 12-job record; every other check is ci = false. A new check is ci = true until
# its first record. The runner's own
# warning (`ci_overrun`, over 120 s) stays the backstop.
#
# WITNESS-HAZARD-RULE: a hazard instance per design decision (an ADR-level rule), not per clause; a
# non-vacuity witness only where no named run reaches its state. The witnesses kept: owner-flows-witness-phantom-connect,
# fwd-pair-witness-watch-half-close, fwd-pair-dgram-witness-vmm-exit. An invariant's teeth are shown by the hazard of the
# decision it defends.
#
# Modules: owner_flows (control sessions, flow admission, launch attribution, the dial, the beacon),
# fwd_pair (the in-kernel forwarder, EVMOD), flow_quota (the per-allocation quota counts half-closed flows),
# cid_lease (CID-NOCLAIM, RESET-EXIT, NO-SURVIVE), quiescence (QHOLD, boot refusal), udp_slots (guest
# UDP slots).

# ==== owner_flows: control sessions, flow admission, launch attribution (ATTR-TOKEN, ATTR-LIVE-CLAIM), the dial (INB-1), the beacon

# Control sessions, flow admission, launch attribution (ATTR-TOKEN), host-opened dials (U-1, U-5).
# Invariants 1, 3, 4, 4+ (CurrentGeneration), ClosedIsTerminal, NoCrossLaunchMsg, NoCrossLaunchSessionHeld
[[check]]
name = "owner-flows-safety-tlc"
spec = "owner_flows.qnt"
main = "flows_ok"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = false
timeout_secs = 3600

# Two concurrent host-opened dials (two dial slots): bounded Safety on the instance TLC's `owner-flows-safety-tlc` does
# not cover (flows_ok carries one host-opened flow). Safety on this instance was otherwise checked along the core2 named
# runs on flows_conf only.
[[check]]
name = "owner-flows-two-safety-apalache"
spec = "owner_flows.qnt"
main = "flows_two"
invariant = "Safety"
backend = "apalache"
max_steps = 10
expect = "holds"
ci = false
timeout_secs = 1800

[[check]]
name = "owner-flows-guest-half-ends"
spec = "owner_flows.qnt"
main = "flows_one"
temporal = "GuestHalfEnds"
backend = "tlc"
expect = "holds"
ci = false
# U-5 + K-A4: a guest TcpAccept half (accepted, or still in the guest's accept queue) whose host side closed is
# eventually torn down. The property mentions the host-opened flow only, so it is checked on the one-flow instance
# `flows_one` (one guest-opened flow, one host-opened flow), not on `flows_ok` (15.1 M states, 53 min, 10 GB heap)
timeout_secs = 1800

[[check]]
name = "owner-flows-witness-phantom-connect"
spec = "owner_flows.qnt"
main = "flows_ok"
invariant = "WitnessNoPhantomConnect"
backend = "apalache"
max_steps = 14
expect = "violation"
ci = true

# Teeth: each hazard switches one design rule off (expected violation)
[[check]]
name = "owner-flows-hazard-split-claim"
spec = "hazard/owner_flows_hazards.qnt"
main = "flows_bugSplitClaim"
invariant = "OneLiveSession"
backend = "apalache"
max_steps = 14
expect = "violation"
ci = false

[[check]]
name = "owner-flows-hazard-attach-before-read"
spec = "hazard/owner_flows_hazards.qnt"
main = "flows_bugAttachEarly"
invariant = "NoAttachBeforeRead"
