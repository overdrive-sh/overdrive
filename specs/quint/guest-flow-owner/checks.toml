# Teeth (ATTR-LIVE-CLAIM order): the session claim taken at accept, before the ControlOpen is read — a
# stale connection of one launch holds the claim when the next launch's session arrives. (Its
# SessionBecomesLive check is not teeth for this rule — the stale holder is closed at its read, so
# progress holds.)
[[check]]
name = "owner-flows-hazard-claim-before-token-held"
spec = "hazard/owner_flows_hazards.qnt"
main = "flows_bugClaimBeforeToken"
invariant = "NoCrossLaunchSessionHeld"
backend = "tlc"
expect = "violation"
ci = true

# Teeth (ATTR-LIVE-CLAIM): the CID state checked at accept only, the claim
# step comparing with the lease token (Retiring included). Its first-run counterexample: a dead
# launch's queued control connection accepted while Provisioned and read after teardown takes the
# claim, which survives pool.release; the next lease's session is refused SessionHeld
[[check]]
name = "owner-flows-hazard-no-claim-recheck-held"
spec = "hazard/owner_flows_hazards.qnt"
main = "flows_bugNoClaimRecheck"
invariant = "NoCrossLaunchSessionHeld"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "owner-flows-hazard-no-claim-recheck-current"
spec = "hazard/owner_flows_hazards.qnt"
main = "flows_bugNoClaimRecheck"
invariant = "CurrentGeneration"
backend = "tlc"
expect = "violation"
ci = true

# Rejected alternative to ATTR-LIVE-CLAIM (recorded as its behaviour, not as design): teardown also
# closes connections in `reading`, and the claim step compares with the lease token. Prediction: every
# safety invariant holds in this model (whose only owner listener is the control session); the
# design rejects it because its correctness rests on teardown knowing every unread connection
# across the owner's listeners and the driver
[[check]]
name = "owner-flows-alt-teardown-closes-reading-safety"
spec = "hazard/owner_flows_hazards.qnt"
main = "flows_altTeardownClosesReading"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = false
timeout_secs = 3600

# Beacon (VM driver, port 1234; ADR-0157, ATTR-TOKEN, ATTR-LIVE-CLAIM): instance `flows_beacon`. READY is
# read, then compared with the live launch's token and the beacon claim taken in one step; driver.stop ends
# liveness, closes the beacon session and releases the claim in one step, before pool.release. Prediction:
