main = "safe_runsLateClearPending"
run = "WakeupDuringRunIsNotLost"
backend = "evaluator"
expect = "violation"
ci = true

[[check]]
name = "fwd-safe-hazard-no-sweep-recheck-run"
spec = "hazard/fwd_safe_hazards.qnt"
main = "safe_runsNoSweepRecheck"
run = "SweepStoresBeforeErrReadRechecksUnderTableLock"
backend = "evaluator"
expect = "violation"
ci = true

# U-R1 (EVMOD-CTL recovery step 1, DR2-CLOSE): the recovery ends a held GuestStream whose watch already ended as an
# owner abort. Predicted: the design run holds; with the rule off, RecoveryEndsHeldStream is violated (a guest
# half-close ends the watch, then the recovery's close leaves the held stream un-ended) and the run fails.

[[check]]
name = "fwd-pair-run-recovery-ends-held-stream-whose-watch-ended"
spec = "fwd_pair.qnt"
main = "pair_conf"
run = "RecoveryEndsHeldStreamWhoseWatchEnded"
backend = "evaluator"
expect = "holds"
ci = true

[[check]]
name = "fwd-pair-hazard-recovery-keeps-ended-stream"
spec = "hazard/fwd_pair_stream_hazards_3.qnt"
main = "pair_bugRecoveryKeepsEndedStream"
invariant = "RecoveryEndsHeldStream"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "fwd-pair-hazard-recovery-keeps-ended-stream-run"
spec = "hazard/fwd_pair_stream_hazards_4.qnt"
main = "pair_confRecoveryKeepsEndedStream"
run = "RecoveryEndsHeldStreamWhoseWatchEnded"
backend = "evaluator"
expect = "violation"
ci = true
