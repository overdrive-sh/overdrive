# P2/P5 owner protocol only; no product control-plane model or runtime mechanism.

[[check]]
name = "runner-safety"
spec = "runner_protocol.qnt"
main = "runner_ok"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "runner-owners-progress"
spec = "runner_protocol.qnt"
main = "runner_ok"
temporal = "OwnersEventuallyEnd"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "runner-maintenance-progress"
spec = "runner_protocol.qnt"
main = "runner_ok"
temporal = "MaintenanceEventuallyResolves"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "runner-hazard-exclusive-ordinary"
spec = "hazard/runner_hazards.qnt"
main = "runner_bugOrdinaryExclusive"
invariant = "OrdinaryDoesNotBlockOrdinary"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "runner-hazard-collect-at-terminal"
spec = "hazard/runner_hazards.qnt"
main = "runner_bugCollectAtTerminal"
invariant = "NoPrematureCommandCompletion"
backend = "tlc"
expect = "violation"
ci = true

