# Checks the `cargo xtask quint` runner executes for specs/quint/probe-count/.
# Main instance probe_streak (the approved rule); hazard/ instances switch one rule off each.

# ---- main instance: every invariant holds

[[check]]
name = "probe-count-no-early-terminate"
spec = "probe_count.qnt"
main = "probe_streak"
invariant = "NoEarlyTerminate"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "probe-count-no-react-on-same-row"
spec = "probe_count.qnt"
main = "probe_streak"
invariant = "NoReactOnSameRow"
backend = "tlc"
expect = "holds"
ci = true

