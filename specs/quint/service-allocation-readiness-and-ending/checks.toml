# Checks the `cargo xtask quint` runner executes for specs/quint/service-allocation-readiness-and-ending/ (feature service-allocation-readiness-and-ending,
# decisions D1, D3, D5, D6, D7, D8, D9, D10, D11, with the B1 and B2 rulings of 2026-11-03; D2 and D4 are contract / non-change decisions covered by named runs).
#
# Modules: hook_ownership (D1, D3; D2, D4 runs), restart_authority (D5, D6, D7, D8), liveness_gate (D9), progress_deadline
# (D10), stream_snapshot (D11). Each `main` is an instance: `*_ok` (the design, checked), `*_conf` (records conf_step; only
# its named runs are checked), `*_bug*` in hazard/ (one design decision's rule switched off, expect = "violation").
# One hazard per decision; no witness (every reachable state is reached by a named run); no bounded copy of an exhaustive check.
# ci: every check finishes in under two minutes in the recorded run.

