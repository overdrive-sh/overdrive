# Checks for specs/quint/restart-generation/: ADR-0335 (a restart generation is handled when its successor is observed),
# ADR-0337 (a pre-driver failure writes a charged Failed row) and ADR-0338 (an admission refusal writes no row and charges
# nothing); budget abstraction R-1 = A: the per-allocation restart count. One decision, one hazard.
# ci = true on each check that takes under two minutes (set per check). Runs on rg_conf and rg_conf_job (REC = true) are the
# #[quint_test] pins.

[[check]]
name = "rg-safety-tlc"
spec = "restart_generation.qnt"
main = "rg_ok"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true
timeout_secs = 900

[[check]]
name = "rg-live-replacement"
spec = "restart_generation.qnt"
main = "rg_live_replacement"
temporal = "RunIntentProgress"
backend = "tlc"
expect = "holds"
ci = true
timeout_secs = 600

[[check]]
name = "rg-live-prefail"
spec = "restart_generation.qnt"
main = "rg_live_prefail"
temporal = "PreFailExhausts"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "rg-hazard-stamp-on-emit"
spec = "hazard/restart_generation_hazards.qnt"
main = "rg_bugStampOnEmit"
temporal = "RunIntentProgress"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "rg-hazard-prefail-no-row"
spec = "hazard/restart_generation_hazards.qnt"
main = "rg_bugPrefailNoRow"
temporal = "PreFailExhausts"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "rg-hazard-refusal-charged"
spec = "hazard/restart_generation_hazards.qnt"
main = "rg_bugRefusalCharged"
invariant = "I_CAPACITY_WAIT_NEVER_EXHAUSTS"
backend = "tlc"
expect = "violation"
ci = true

# ADR-0355: an abandoned launch leaves its `Pending` row; the dead row blocks every placement and the workload is never relaunched
[[check]]
name = "rg-hazard-abandon-writes-no-row"
spec = "hazard/restart_generation_hazards.qnt"
main = "rg_bugAbandonWritesNoRow"
temporal = "RunIntentProgress"
backend = "tlc"
expect = "violation"
ci = true

# ADR-0355 item 2 (RB-13): a launch that never ran does not count; the count basis is the newest row that ran
[[check]]
name = "rg-hazard-abandoned-row-counts"
spec = "hazard/restart_generation_hazards.qnt"
main = "rg_bugAbandonedRowCounts"
invariant = "I_ABANDONED_ROWS_DO_NOT_COUNT"
backend = "tlc"
expect = "violation"
ci = true

