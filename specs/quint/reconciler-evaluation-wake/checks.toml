# Checks the `cargo xtask quint` runner executes for specs/quint/reconciler-evaluation-wake/.
# wake_full is the main (every decision on, every fault kind); wake_retention restricts the faults to the dataplane failing (D-3);
# wake_conf is the conformance main (records conf_step, the broker counters); hazard/ instances switch one decision off.

# ---- main instance: safety and progress hold

[[check]]
name = "evaluation-wake-safety"
spec = "evaluation_wake.qnt"
main = "wake_full"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "evaluation-wake-progress-by-pass"
spec = "evaluation_wake.qnt"
main = "wake_full"
temporal = "ProgressByPass"
backend = "tlc"
expect = "holds"
ci = false
timeout_secs = 1200

[[check]]
name = "evaluation-wake-retention-schedules-backed-off-key"
spec = "evaluation_wake.qnt"
main = "wake_retention"
invariant = "RetentionSchedulesBackedOffKey"
backend = "tlc"
expect = "holds"
ci = true

# ---- hazards (one per decision)

[[check]]
name = "evaluation-wake-hazard-no-pass"
spec = "hazard/evaluation_wake_hazards.qnt"
main = "wake_noPass"
temporal = "ProgressByPass"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "evaluation-wake-hazard-no-retention"
spec = "hazard/evaluation_wake_hazards.qnt"
main = "wake_noRetention"
invariant = "RetentionSchedulesBackedOffKey"
backend = "tlc"
expect = "violation"
ci = true

# ---- named runs (critical scenarios), executed by `quint test` on the conformance main

