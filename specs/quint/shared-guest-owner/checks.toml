# Checks for specs/quint/shared-guest-owner/ (shared-guest owner protocol, DDD-8/9/10).
# ci = true iff the check took under 60 s in the latest record (guest-every-client-terminates took 115 s).
# Decisions: D-OWNER, D-LIFE, D-SERIAL, D-DETACH, D-TAINT. One hazard per decision.

[[check]]
name = "guest-safety-tlc"
spec = "shared_guest.qnt"
main = "guest_ok"
invariant = "Safety"
backend = "tlc"
expect = "holds"
ci = true

[[check]]
name = "guest-every-client-terminates"
spec = "shared_guest.qnt"
main = "guest_ok"
temporal = "EveryClientTerminates"
backend = "tlc"
expect = "holds"
ci = false

[[check]]
name = "guest-hazard-owner"
spec = "hazard/guest_hazards.qnt"
main = "guest_bugNoLock"
invariant = "I_OWNER_UNIQUE"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "guest-hazard-serial"
spec = "hazard/guest_hazards.qnt"
main = "guest_bugNoSerial"
invariant = "I_SERIAL"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "guest-hazard-taint"
spec = "hazard/guest_hazards.qnt"
main = "guest_bugNoTaint"
invariant = "I_NO_REUSE"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "guest-hazard-orphan"
spec = "hazard/guest_hazards.qnt"
main = "guest_bugOrphan"
invariant = "I_NO_ORPHAN"
backend = "tlc"
expect = "violation"
ci = true

[[check]]
name = "guest-hazard-detach"
spec = "hazard/guest_hazards.qnt"
main = "guest_bugCancelOnDisconnect"
invariant = "I_SERIAL"
backend = "tlc"
expect = "violation"
ci = true

