[package]
name = "vsock-device-capacity-probe"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
virtio-devices = { git = "https://github.com/cloud-hypervisor/cloud-hypervisor", rev = "9ed824d6d08df3e96f7d5f50795d9449ac99f431", features = ["kvm"] }
hypervisor = { git = "https://github.com/cloud-hypervisor/cloud-hypervisor", rev = "9ed824d6d08df3e96f7d5f50795d9449ac99f431", features = ["kvm"] }
vm-memory = { version = "0.17.1", features = ["backend-mmap", "backend-atomic", "backend-bitmap"] }
virtio-queue = "0.17.0"
vmm-sys-util = "0.15.0"
seccompiler = "0.5.0"
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 2
debug = false
