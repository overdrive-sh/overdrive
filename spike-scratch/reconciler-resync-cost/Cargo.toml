# V-3 spike (reconciler-convergence-guarantees): self-contained, NOT a member of the repo workspace.
# Links the real production crates by path. Never edits crates/.
[package]
name = "resync-cost"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
overdrive-control-plane = { path = "../../crates/overdrive-control-plane" }
overdrive-core          = { path = "../../crates/overdrive-core" }
overdrive-reconcilers   = { path = "../../crates/overdrive-reconcilers" }
overdrive-store-local   = { path = "../../crates/overdrive-store-local" }
overdrive-sim           = { path = "../../crates/overdrive-sim" }
overdrive-worker        = { path = "../../crates/overdrive-worker" }
overdrive-host          = { path = "../../crates/overdrive-host" }
tokio      = { version = "1", features = ["full"] }
futures    = "0.3"
axum       = { version = "0.7", default-features = false, features = ["http1", "http2", "json", "tokio", "query"] }
tempfile   = "3"
ipnet      = { version = "2", features = ["serde"] }
libc       = "0.2"
serde_json = "1"
tokio-util = "0.7"

# Same release profile as the repo workspace root.
[profile.release]
lto             = "thin"
codegen-units   = 1
debug           = "line-tables-only"
panic           = "abort"
strip           = "symbols"
