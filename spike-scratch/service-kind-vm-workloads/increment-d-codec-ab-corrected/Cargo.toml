[package]
name = "service-vm-codec-ab-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
codec-json = ["dep:serde"]
codec-rkyv = ["dep:rkyv"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
rkyv = { version = "0.8", features = ["bytecheck"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "abort"
strip = "symbols"

[profile.release-unstripped]
inherits = "release"
strip = "none"
