# PROBE increment-e — microvm-driver-cloud-hypervisor slice-00 (P6 on BARE METAL).
# Throwaway. Self-contained workspace root. NEVER moved into crates/.
[workspace]

[package]
name = "spike-increment-e"
version = "0.0.0"
