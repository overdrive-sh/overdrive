# Overdrive Linux dev VM.
#
# Installs everything the Phase 1–4 roadmap needs for inner-loop development:
#
#   Runtime drivers (§6)   cloud-hypervisor, virtiofsd, wasmtime, kraft (Unikraft)
#   eBPF toolchain (§7)    clang, llvm, libbpf, bpftool, xdp-tools
#   Tier 2 BPF unit (§22)  via `BPF_PROG_TEST_RUN` — already in-kernel
#   Tier 3 integration     virtme-ng (Python), QEMU
#   Rust                   rustup (toolchain governed by rust-toolchain.toml),
#                          cargo-nextest, cargo-deny
#   Networking             tcpdump, iproute2, bridge-utils
#   Debugging              pwru (Cilium — packet trace through kernel hooks)
#   Formal methods         quint (npm, pinned) on Node.js LTS, Temurin JDK 21, pre-fetched Apalache
#
# Yocto / bitbake are deliberately NOT installed — Image Factory builds are
# 60–90 minutes cold and 100 GB+ of sstate cache; belongs on dedicated CI.
#
# Usage:
#   cargo xtask lima up                  # or: limactl start --name=overdrive ./infra/lima/overdrive-dev.yaml
#   cargo xtask lima shell               # interactive shell
#   cargo xtask lima run -- cargo xtask dst
#   cargo xtask lima stop / delete

minimumLimaVersion: 2.0.0

# ────────────────────────────────────────────────────────────────────────────
# Base image — Ubuntu 26.04 LTS (kernel 7.0: BPF LSM, kTLS incl. TLS 1.3
# KeyUpdate, CONFIG_NET_HANDSHAKE, cgroups v2, KVM). Chosen so the dev VM is
# at-or-above the pinned 6.18-LTS appliance kernel (ADR-0068).
#
# NOTE — dev/prod kernel skew: Ubuntu 26.04 ships mainline **7.0**, which is
# *newer* than the production appliance pin (6.18 LTS). That's fine for the
# inner loop (every feature the code uses is present in both), but the
# authoritative kernel-fidelity signal is CI's Tier-3 LVH matrix pinned at
# 6.18 — NOT this VM. If exact 6.18 fidelity is ever needed locally, install
# a mainline 6.18 kernel here instead of bumping the Ubuntu release.
#
# Native arch on host — amd64 on Intel, arm64 on Apple Silicon. All of the
# tooling we install has working aarch64 support.
# ────────────────────────────────────────────────────────────────────────────
# limactl 2.1.x ships no `_images/ubuntu-26.04` template yet, so the cloud
# image is referenced by direct URL (digest omitted — Lima computes it on
# download; `releases/26.04/release/` is the stable GA target, kernel
# 7.0.0-15-generic per the image manifest).
images:
  - location: "https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# ────────────────────────────────────────────────────────────────────────────
# VM backend — auto-detected by Lima. Apple Virtualization.framework (vz)
# on macOS; QEMU with KVM acceleration on Linux. virtiofs mounts are auto-
# selected on vz; 9p or reverse-sshfs on qemu.
#
# Nested virtualization is required for running QEMU (Tier 3 kernel matrix)
# and Cloud Hypervisor *inside* the Lima guest.
# ────────────────────────────────────────────────────────────────────────────
nestedVirtualization: true

vmOpts:
  vz:
    rosetta:
      enabled: false    # native Linux arch only — we don't want x86-on-arm64
      binfmt:  false

# ────────────────────────────────────────────────────────────────────────────
# Resources — tuned for parallel Rust + BPF + kernel builds. Override at
# creation time with --cpus=N --memory=N --disk=N.
# ────────────────────────────────────────────────────────────────────────────
cpus: 12
memory: "32GiB"
disk: "150GiB"

mounts:
  - location: "~"
    writable: true

containerd:
  system: false
  user:   false

# ────────────────────────────────────────────────────────────────────────────
# Env — literal values only. Lima writes these verbatim to /etc/environment
# and `boot.sh` exports each line with `export "$line"`, which does NOT
# expand ${HOME} / ${PATH} — a literal string ends up in the variable and
# PATH-dependent commands (sed, etc.) break for the rest of boot.
# Anything that needs shell expansion lives in ~/.profile instead (see the
# user-mode provisioning step below).
# ────────────────────────────────────────────────────────────────────────────
env:
  CARGO_TERM_COLOR:  "always"
  RUST_LOG:          "overdrive=info"
  OVERDRIVE_LIMA_VM: "1"

# ────────────────────────────────────────────────────────────────────────────
# Pinned versions for single-file binary downloads.
#
# THE RULE: track LATEST STABLE. A pin below latest needs a named blocking
# reason written next to it plus the condition that clears it — "our tests pass
# on the pinned version" is NOT a reason. "Bump as releases land" was the old
# wording and it did not happen: on 2026-08-10 every pin here was stale, CH by
# 7 releases (14 months) and wasmtime by 18 major versions, with a fully green
# board the whole time, because every check in this repo verifies
# installed == pinned and none verifies pinned == latest.
#
# These are duplicated in infra/provision/versions.env and kept aligned BY EYE.
# That duplication is a known second defect; see the note in that file.
# ────────────────────────────────────────────────────────────────────────────
param:
  # Local fork source/build identity; binaries are built from the pinned source
  # and checksum-gated in the user provision block. No release asset is used.
  CLOUD_HYPERVISOR_FORK_REPO:       "overdrive-sh/cloud-hypervisor"
  CLOUD_HYPERVISOR_FORK_REV:        "f252bb20b0d141d59e4c15a9ac09c5c2dd7c350d"
  CLOUD_HYPERVISOR_BUILD_TOOLCHAIN: "1.89.0"
  CLOUD_HYPERVISOR_SHA256_X86_64:   "6d54fbd2611e692fda00e476fc0723e9502bfd8acd53c8bc46edd96e84f3e842"
  CLOUD_HYPERVISOR_SHA256_AARCH64:  "74195594db430695d4fbd9a8ecbc1d6d4b196f17c52afa6a3e96c967d86a91cc"
  # NOTE FOR THE NEXT READER: wasmtime's "v46" is NOT cloud-hypervisor's "v46".
  # Two unrelated projects that happen to collide on a version number, on
  # adjacent lines, at the exact moment CH is being moved OFF v46. Read the key,
  # not the number.
  WASMTIME_VERSION:         "v46.0.2"
  PWRU_VERSION:             "v1.0.11"
  # Linux 7.0's checker-valid.sh probes __typeof_unqual__. The Ubuntu sparse
  # package is older than that parser support, so install this validated
  # sparse development revision until the distro package passes the probe.
  SPARSE_COMMIT:             "c4640450b84718f4ec8f14138e5cb28256078f7b"
  # The stock Linux 7.0 headers record CONFIG_PAHOLE_VERSION=131; keep the
  # Kbuild host on the matching pahole release to avoid a Kbuild warning.
  PAHOLE_PACKAGE_VERSION:    "1.31-2ubuntu1"
  # Quint formal-methods toolchain (specs/quint/**, `cargo xtask quint`).
  # Mirrors the pins in infra/provision/install-quint.sh (the CI installer);
  # keep the two aligned. Held at v0.32.0 below latest (v0.33.0, 2026-09-28):
  # it is the version the quint-connect 0.1.2 conformance precedent was
  # validated against. Clears once v0.33.0 runs the specs/quint/** checks
  # and quint-connect green.
  QUINT_VERSION:            "0.32.0"
  # sha512 of the registry tarball quint-0.32.0.tgz (npm `dist.integrity`).
  # Quint runs from its npm package under Node.js, NOT the `deno compile`
  # release binary, whose HTTP/2 client stalls against the Apalache server.
  QUINT_TGZ_SHA512:         "f58a238bb0d4ea6a119b5a1f0da37e7ed77135c1067228866e6ede37832395c09b7efeff63fcdc85a75c5d746631998df684cf5d493d1a686340e8400c9b2249"
  # Node.js 24 LTS (Krypton), latest 24.x as of 2026-10; tarball sha256 from
  # https://nodejs.org/dist/v24.21.0/SHASUMS256.txt.
  NODE_VERSION:             "v24.21.0"
  NODE_SHA256_X64:          "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6"
  NODE_SHA256_ARM64:        "6ad1325edbdb5649c379b75a237147a666c95d4f9ae8d340fef2d1575d289ad2"
  # Apalache version Quint v0.32.0 downloads by default; the provisioning
  # step pre-fetches it into QUINT_HOME and fails if this dir is absent.
  QUINT_APALACHE_VERSION:   "0.56.1"
  # Temurin JDK 21 — Apalache and TLC run on the JVM.
  TEMURIN_JDK21_RELEASE:    "jdk-21.0.12.1+1"

# ────────────────────────────────────────────────────────────────────────────
# Provisioning.
# ────────────────────────────────────────────────────────────────────────────
provision:
  # -------------------------------------------------------------------------
  # apt packages — BPF toolchain, QEMU, Go, Python, networking, build tools.
  # NOTE: no `qemu-kvm` — it is a defunct transitional package with no
  # installation candidate on Ubuntu 26.04, and apt is transactional, so
  # naming it aborts the WHOLE install (dropping every build dep). KVM comes
  # from qemu-system-* + the udev rule below; the dummy metapackage is not
  # needed.
  # -------------------------------------------------------------------------
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive

      apt-get update
      apt-get install -y --no-install-recommends \
          build-essential pkg-config ca-certificates curl git jq \
          unzip xz-utils cpio bzip2 zstd file \
          clang lld mold llvm libclang-dev \
          libelf-dev libbpf-dev linux-libc-dev \
          pahole={{ .Param.PAHOLE_PACKAGE_VERSION }} \
          linux-tools-common linux-tools-generic \
          zlib1g-dev libssl-dev libzstd-dev libudev-dev \
          qemu-system-x86 qemu-system-arm qemu-utils \
          virtiofsd \
          xdp-tools bpfcc-tools \
          tcpdump iproute2 bridge-utils \
          python3 python3-venv python3-pip pipx \
          e2fsprogs musl-tools

      # The guest TCP-correlation C/CO-RE object is pinned to Clang 21;
      # this is independent of the LLVM 22 toolchain used by bpf-linker.
      curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
      chmod +x /tmp/llvm.sh
      bash /tmp/llvm.sh 21
      apt-get update
      apt-get install -y --no-install-recommends clang-21 libbpf-dev
      BPFTOOL_CANDIDATE="$(apt-cache policy bpftool | awk '$1 == "Candidate:" {print $2}')"
      if [ -n "${BPFTOOL_CANDIDATE}" ] && [ "${BPFTOOL_CANDIDATE}" != "(none)" ]; then
        apt-get install -y --no-install-recommends bpftool
      else
        apt-get install -y --no-install-recommends \
          linux-tools-common linux-tools-generic
        BPFTOOL_BINARY="$(find /usr/lib -path '/usr/lib/linux-tools-*/bpftool' -type f -executable -print -quit)"
        if [ -z "${BPFTOOL_BINARY}" ]; then
          echo "linux-tools-generic did not install an executable bpftool" >&2
          exit 1
        fi
        install -m 0755 "${BPFTOOL_BINARY}" /usr/local/bin/bpftool
      fi
      command -v bpftool
      bpftool version
      BTF="${OVERDRIVE_BPF_TARGET_BTF:-/sys/kernel/btf/vmlinux}"
      test -r "${BTF}"
      bpftool btf dump file "${BTF}" format c >/dev/null

      # The module must be built against the running kernel, including its
      # generated headers rather than only the userspace UAPI headers.
      apt-get install -y --no-install-recommends "linux-headers-$(uname -r)"

      # Build the sparse revision that passes the pinned Linux 7.0
      # checker's __typeof_unqual__ validation.
      SPARSE_SOURCE="$(mktemp -d)"
      trap 'rm -rf "${SPARSE_SOURCE}"' EXIT
      git -C "${SPARSE_SOURCE}" init
      git -C "${SPARSE_SOURCE}" remote add origin \
        https://git.kernel.org/pub/scm/devel/sparse/sparse.git
      git -C "${SPARSE_SOURCE}" fetch --depth=1 origin "{{ .Param.SPARSE_COMMIT }}"
      git -C "${SPARSE_SOURCE}" checkout --detach FETCH_HEAD
      test "$(git -C "${SPARSE_SOURCE}" rev-parse HEAD)" = "{{ .Param.SPARSE_COMMIT }}"
      make -C "${SPARSE_SOURCE}" LLVM_CONFIG=/bin/false sparse
      install -m 0755 "${SPARSE_SOURCE}/sparse" /usr/local/bin/sparse
      sparse --version

  # -------------------------------------------------------------------------
  # KVM permissions via udev — cleaner than `usermod -a -G kvm`. The rule
  # survives kernel module reloads and applies to any user.
  # -------------------------------------------------------------------------
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euxo pipefail
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
        | tee /etc/udev/rules.d/99-kvm4all.rules
      udevadm control --reload-rules
      udevadm trigger --name-match=kvm || true

  # -------------------------------------------------------------------------
  # IPv4 forwarding — required for `bpf_fib_lookup(flags=0)` to return
  # RET_SUCCESS against forwarded destinations. Without it the helper
  # returns BPF_FIB_LKUP_RET_FWD_DISABLED and Tier 2 FIB-hit tests
  # (`xdp_{service_map,reverse_nat}_redirect_neigh`) fall through to
  # XDP_PASS. Ubuntu defaults this to 0; this drop-in flips it
  # to 1 for the dev VM. Future Tier 3 real-veth tests need it too.
  # -------------------------------------------------------------------------
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euxo pipefail
      cat > /etc/sysctl.d/99-overdrive.conf <<'EOF'
      # Overdrive dev VM — required by Tier 2 BPF unit tests that call
      # bpf_fib_lookup, and by Tier 3 real-veth integration tests.
      net.ipv4.ip_forward = 1
      EOF
      sysctl --system >/dev/null

  # -------------------------------------------------------------------------
  # Wasmtime — the WASM driver runtime (§6, §16).
  # -------------------------------------------------------------------------
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euxo pipefail
      VER="{{ .Param.WASMTIME_VERSION }}"
      ARCH="$(uname -m)"
      TARBALL="wasmtime-${VER}-${ARCH}-linux.tar.xz"
      curl -fsSL -o "/tmp/${TARBALL}" \
        "https://github.com/bytecodealliance/wasmtime/releases/download/${VER}/${TARBALL}"
      tar -C /tmp -xf "/tmp/${TARBALL}"
      install -m 0755 "/tmp/wasmtime-${VER}-${ARCH}-linux/wasmtime" /usr/local/bin/wasmtime
      rm -rf "/tmp/wasmtime-${VER}-${ARCH}-linux" "/tmp/${TARBALL}"
      wasmtime --version

  # -------------------------------------------------------------------------
  # pwru — Cilium's packet-where-are-you tracer. Single static binary;
  # pre-merge tiers gate regressions, pwru explains *why* a packet died
  # when a Tier 3 test or manual repro fails. See `.claude/rules/testing.md`
  # § "Debugging real-kernel failures".
  # -------------------------------------------------------------------------
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euxo pipefail
      VER="{{ .Param.PWRU_VERSION }}"
      ARCH="$(uname -m)"
      case "${ARCH}" in
        x86_64)  ASSET_ARCH="amd64" ;;
        aarch64) ASSET_ARCH="arm64" ;;
        *) echo "unsupported arch: ${ARCH}"; exit 1 ;;
      esac
      TARBALL="pwru-linux-${ASSET_ARCH}.tar.gz"
      curl -fsSL -o "/tmp/${TARBALL}" \
        "https://github.com/cilium/pwru/releases/download/${VER}/${TARBALL}"
      tar -C /tmp -xf "/tmp/${TARBALL}" pwru
      install -m 0755 /tmp/pwru /usr/local/bin/pwru
      rm -f "/tmp/${TARBALL}" /tmp/pwru
      pwru --version

  # -------------------------------------------------------------------------
  # Quint formal-methods toolchain — Node.js LTS + the quint npm package, Temurin JDK 21, and a
  # pre-populated QUINT_HOME (/opt/quint-toolchain/quint-home: the Apalache
  # distribution and the Rust evaluator Quint otherwise downloads lazily).
  # /usr/local/bin/quint is a wrapper that defaults QUINT_HOME and JAVA_HOME,
  # so `quint` works for the lima user AND under `cargo xtask lima run`'s
  # `sudo env PATH=…` (which drops every other variable). Same logic as
  # infra/provision/install-quint.sh — keep aligned.
  # -------------------------------------------------------------------------
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euxo pipefail
      QUINT_VERSION="{{ .Param.QUINT_VERSION }}"
      NODE_VERSION="{{ .Param.NODE_VERSION }}"
      APALACHE_VERSION="{{ .Param.QUINT_APALACHE_VERSION }}"
      JDK_RELEASE="{{ .Param.TEMURIN_JDK21_RELEASE }}"
      JDK_FILE_VERSION="$(echo "${JDK_RELEASE#jdk-}" | tr '+' '_')"
      PREFIX=/opt/quint-toolchain
      BIN_DIR=/usr/local/bin
      case "$(uname -m)" in
        x86_64)  NARCH=x64; NSHA="{{ .Param.NODE_SHA256_X64 }}"; JARCH=x64 ;;
        aarch64) NARCH=arm64; NSHA="{{ .Param.NODE_SHA256_ARM64 }}"; JARCH=aarch64 ;;
        *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
      esac
      NODE_DIR="${PREFIX}/node"
      NPM_PREFIX="${PREFIX}/npm"
      JDK_DIR="${PREFIX}/jdk"
      QUINT_HOME_DIR="${PREFIX}/quint-home"
      WORK="$(mktemp -d)"
      trap 'rm -rf "${WORK}"' EXIT
      mkdir -p "${QUINT_HOME_DIR}" "${NPM_PREFIX}"

      if [ ! -x "${NODE_DIR}/bin/node" ]; then
        curl -fsSL -o "${WORK}/node.tar.xz" \
          "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-${NARCH}.tar.xz"
        echo "${NSHA}  ${WORK}/node.tar.xz" | sha256sum -c -
        rm -rf "${NODE_DIR}"; mkdir -p "${NODE_DIR}"
        tar -xJf "${WORK}/node.tar.xz" -C "${NODE_DIR}" --strip-components=1
      fi

      if [ ! -x "${NPM_PREFIX}/bin/quint" ] \
         || [ "$("${NODE_DIR}/bin/node" "${NPM_PREFIX}/bin/quint" --version)" != "${QUINT_VERSION}" ]; then
        curl -fsSL -o "${WORK}/quint.tgz" \
          "https://registry.npmjs.org/@informalsystems/quint/-/quint-${QUINT_VERSION}.tgz"
        echo "{{ .Param.QUINT_TGZ_SHA512 }}  ${WORK}/quint.tgz" | sha512sum -c -
        PATH="${NODE_DIR}/bin:${PATH}" npm install -g --prefix "${NPM_PREFIX}" "${WORK}/quint.tgz"
      fi

      if [ ! -x "${JDK_DIR}/bin/java" ]; then
        curl -fsSL -o "${WORK}/jdk.tar.gz" \
          "https://github.com/adoptium/temurin21-binaries/releases/download/${JDK_RELEASE/+/%2B}/OpenJDK21U-jdk_${JARCH}_linux_hotspot_${JDK_FILE_VERSION}.tar.gz"
        rm -rf "${JDK_DIR}"; mkdir -p "${JDK_DIR}"
        tar -xzf "${WORK}/jdk.tar.gz" -C "${JDK_DIR}" --strip-components=1 --exclude='*/legal'
      fi

      cat > "${BIN_DIR}/quint" <<EOF
      #!/bin/sh
      export QUINT_HOME="\${QUINT_HOME:-${QUINT_HOME_DIR}}"
      export JAVA_HOME="\${JAVA_HOME:-${JDK_DIR}}"
      export PATH="${NODE_DIR}/bin:\${JAVA_HOME}/bin:\${PATH}"
      exec "${NPM_PREFIX}/bin/quint" "\$@"
      EOF
      chmod 0755 "${BIN_DIR}/quint"
      ln -sf "${JDK_DIR}/bin/java" "${BIN_DIR}/java"

      # Pre-fetch Apalache + the Rust evaluator (dedicated server port so a
      # concurrently-running Apalache server on Quint's default port is not
      # reused).
      if [ ! -x "${QUINT_HOME_DIR}/apalache-dist-${APALACHE_VERSION}/apalache/bin/apalache-mc" ] \
         || ! ls -d "${QUINT_HOME_DIR}"/rust-evaluator-* >/dev/null 2>&1; then
        cat > "${WORK}/prefetch.qnt" <<'EOF'
      module prefetch {
        var x: int
        action init = x' = 0
        action step = all { x < 2, x' = x + 1 }
        val ok = x >= 0
      }
      EOF
        (
          cd "${WORK}"; export TMPDIR="${WORK}"
          "${BIN_DIR}/quint" run prefetch.qnt --invariant=ok --max-samples=1 --max-steps=2 </dev/null
          "${BIN_DIR}/quint" verify prefetch.qnt --invariant=ok --max-steps=2 \
            --server-endpoint=localhost:18821 </dev/null
        )
      fi
      test -x "${QUINT_HOME_DIR}/apalache-dist-${APALACHE_VERSION}/apalache/bin/apalache-mc"
      chmod -R a+rX "${PREFIX}"
      quint --version
      java -version

  # -------------------------------------------------------------------------
  # kraft (Unikraft build CLI) — direct .deb from the kraftkit GitHub
  # release. The official `get.kraftkit.sh` installer prompts for the sudo
  # password on a TTY (which cloud-init doesn't have); `deb.pkg.kraftkit.sh`
  # returns 404 on arm64. The .deb per-arch asset works on both.
  # -------------------------------------------------------------------------
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      ARCH="$(dpkg --print-architecture)"
      VER="$(curl -fsSL https://api.github.com/repos/unikraft/kraftkit/releases/latest \
              | jq -r .tag_name | sed 's/^v//')"
      DEB="kraftkit_${VER}_linux_${ARCH}.deb"
      curl -fsSL -o "/tmp/${DEB}" \
        "https://github.com/unikraft/kraftkit/releases/download/v${VER}/${DEB}"
      apt-get install -y "/tmp/${DEB}"
      rm -f "/tmp/${DEB}"
      kraft version

  # -------------------------------------------------------------------------
  # User-level — Rust, cargo tools, virtme-ng. Kraft lives in system
  # mode above because its .deb needs root.
  # -------------------------------------------------------------------------
  - mode: user
    script: |
      #!/usr/bin/env bash
      set -euxo pipefail

      # Rustup — no default toolchain; rust-toolchain.toml governs in-repo.
      if ! command -v rustup >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain none --profile minimal
      fi
      . "${HOME}/.cargo/env"

      # Build and install the pinned Cloud Hypervisor fork locally. The source
      # repository is never used as a release-binary location or stock fallback.
      CH_REPO="{{ .Param.CLOUD_HYPERVISOR_FORK_REPO }}"
      CH_REV="{{ .Param.CLOUD_HYPERVISOR_FORK_REV }}"
      CH_TOOLCHAIN="{{ .Param.CLOUD_HYPERVISOR_BUILD_TOOLCHAIN }}"
      CH_ARCH="$(uname -m)"
      case "${CH_ARCH}" in
        x86_64)
          CH_TARGET="x86_64-unknown-linux-musl"
          CH_EXPECTED="{{ .Param.CLOUD_HYPERVISOR_SHA256_X86_64 }}"
          CH_BUILD_ARGS=(--all --release --features mshv --target "${CH_TARGET}" --locked)
          ;;
        aarch64)
          CH_TARGET="aarch64-unknown-linux-musl"
          CH_EXPECTED="{{ .Param.CLOUD_HYPERVISOR_SHA256_AARCH64 }}"
          CH_BUILD_ARGS=(--all --release --target "${CH_TARGET}" --locked)
          ;;
        *) echo "FATAL: unsupported Cloud Hypervisor build architecture: ${CH_ARCH}" >&2; exit 1 ;;
      esac
      CH_ROOT="/var/tmp/overdrive/cloud-hypervisor/${CH_REV}"
      CH_SOURCE="${CH_ROOT}/source"
      CH_BUILD="${CH_ROOT}/build"
      CH_ARTIFACT="${CH_ROOT}/artifacts/${CH_TARGET}/cloud-hypervisor"
      CH_BUILD_BIN="${CH_BUILD}/${CH_TARGET}/release/cloud-hypervisor"
      CH_INSTALLED="/usr/local/bin/cloud-hypervisor"
      CH_ORIGIN="https://github.com/${CH_REPO}.git"
      rustup toolchain install "${CH_TOOLCHAIN}" --profile minimal
      rustup target add --toolchain "${CH_TOOLCHAIN}" "${CH_TARGET}"
      command -v musl-gcc >/dev/null 2>&1 || { echo "FATAL: musl-gcc is required for ${CH_TARGET}" >&2; exit 1; }
      command -v strip >/dev/null 2>&1 || { echo "FATAL: native strip is required for ${CH_TARGET}" >&2; exit 1; }
      mkdir -p "${CH_ROOT}"
      if [ -e "${CH_SOURCE}/.git" ]; then
        echo "FATAL: Cloud Hypervisor source must be metadata-free: ${CH_SOURCE}" >&2
        exit 1
      fi
      if [ ! -f "${CH_SOURCE}/Cargo.toml" ]; then
        if [ -e "${CH_SOURCE}" ]; then
          echo "FATAL: incomplete local Cloud Hypervisor source: ${CH_SOURCE}" >&2
          exit 1
        fi
        CH_FETCH="$(mktemp -d "${CH_ROOT}/.fetch.XXXXXX")"
        CH_SOURCE_TMP="$(mktemp -d "${CH_ROOT}/.source.XXXXXX")"
        git -C "${CH_FETCH}" init --quiet
        git -C "${CH_FETCH}" remote add origin "${CH_ORIGIN}"
        git -C "${CH_FETCH}" fetch --depth=1 origin "${CH_REV}"
        CH_FETCHED_REV="$(git -C "${CH_FETCH}" rev-parse FETCH_HEAD)"
        if [ "${CH_FETCHED_REV}" != "${CH_REV}" ]; then
          echo "FATAL: fetched Cloud Hypervisor source ${CH_FETCHED_REV}, expected ${CH_REV}" >&2
          exit 1
        fi
        git -C "${CH_FETCH}" archive --format=tar "${CH_REV}" | tar -xf - -C "${CH_SOURCE_TMP}"
        [ ! -e "${CH_SOURCE_TMP}/.git" ] || { echo "FATAL: source archive contains .git" >&2; exit 1; }
        mv "${CH_SOURCE_TMP}" "${CH_SOURCE}"
        rm -rf "${CH_FETCH}"
      fi
      [ -f "${CH_SOURCE}/Cargo.toml" ] || { echo "FATAL: pinned source missing at ${CH_SOURCE}" >&2; exit 1; }
      if [ -e "${CH_ARTIFACT}" ]; then
        [ -f "${CH_ARTIFACT}" ] || { echo "FATAL: staged artifact is not a file: ${CH_ARTIFACT}" >&2; exit 1; }
        if ! printf '%s  %s\n' "${CH_EXPECTED}" "${CH_ARTIFACT}" | sha256sum --check --status; then
          echo "FATAL: staged Cloud Hypervisor checksum mismatch: ${CH_ARTIFACT}" >&2
          exit 1
        fi
      else
        CARGO_TARGET_DIR="${CH_BUILD}" cargo "+${CH_TOOLCHAIN}" build \
          --manifest-path "${CH_SOURCE}/Cargo.toml" "${CH_BUILD_ARGS[@]}"
        [ -f "${CH_BUILD_BIN}" ] || { echo "FATAL: build artifact missing: ${CH_BUILD_BIN}" >&2; exit 1; }
        strip "${CH_BUILD_BIN}"
        if ! printf '%s  %s\n' "${CH_EXPECTED}" "${CH_BUILD_BIN}" | sha256sum --check --status; then
          echo "FATAL: built Cloud Hypervisor checksum mismatch; refusing to stage or install" >&2
          exit 1
        fi
        mkdir -p "$(dirname "${CH_ARTIFACT}")"
        install -m 0755 "${CH_BUILD_BIN}" "${CH_ARTIFACT}"
        if ! printf '%s  %s\n' "${CH_EXPECTED}" "${CH_ARTIFACT}" | sha256sum --check --status; then
          echo "FATAL: staged Cloud Hypervisor checksum mismatch: ${CH_ARTIFACT}" >&2
          exit 1
        fi
      fi
      if [ ! -f "${CH_INSTALLED}" ] || [ ! -x "${CH_INSTALLED}" ] \
         || ! printf '%s  %s\n' "${CH_EXPECTED}" "${CH_INSTALLED}" | sha256sum --check --status; then
        sudo -n install -m 0755 "${CH_ARTIFACT}" "${CH_INSTALLED}"
      fi
      if ! printf '%s  %s\n' "${CH_EXPECTED}" "${CH_INSTALLED}" | sha256sum --check --status; then
        echo "FATAL: installed Cloud Hypervisor checksum mismatch: ${CH_INSTALLED}" >&2
        exit 1
      fi
      "${CH_INSTALLED}" --version
      if ! "${CH_INSTALLED}" --help 2>&1 | grep -q -- '--landlock'; then
        echo "FATAL: this Cloud Hypervisor build has no --landlock" >&2
        exit 1
      fi

      rustup component add rustfmt clippy rust-src || true
      # Pinned, NOT the floating `nightly` channel — bpf-linker's LLVM
      # support lags rustc nightly's LLVM major-version bumps (bpf-linker
      # 0.10.4, latest as of 2026-07-12, tops out at the `llvm-22` Cargo
      # feature; upstream: https://github.com/aya-rs/bpf-linker/blob/main/BUILDING.md).
      # The floating channel bumped LLVM 22.1.8 -> 23.1.0 between the
      # 2026-08-04 and 2026-08-06 nightly builds, which breaks the
      # `bpf-build` / `bpf-clippy` link step with "Error: failure linking
      # module ...". Keep this literal in sync with
      # `xtask::BPF_NIGHTLY_TOOLCHAIN` (`xtask/src/lib.rs`) — that
      # constant's doc comment is the SSOT for the re-pinning procedure.
      rustup toolchain install nightly-2026-08-05 --component rust-src --component clippy --profile minimal || true

      # cargo-binstall pulls prebuilt binaries when crates publish them
      # (cargo-nextest, cargo-deny, cargo-mutants, bpf-linker all do as
      # of 2026). Cold provisioning of these four via `cargo install
      # --locked` was busting Lima's 10-minute startup timeout in CI;
      # binstall reduces the user-mode block from many minutes of source
      # builds to <30s of curl + extract. Falls back to a source build
      # automatically if a target lacks prebuilts.
      if ! command -v cargo-binstall >/dev/null 2>&1; then
        curl -fsSL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
          | bash
      fi
      cargo binstall --no-confirm --force \
        cargo-deny cargo-nextest cargo-mutants bpf-linker sccache || true

      # virtme-ng (fast kernel boot from source tree) — via pipx so it gets
      # its own venv and doesn't collide with system python packages.
      pipx ensurepath
      if ! command -v virtme-ng >/dev/null 2>&1; then
        pipx install virtme-ng || true
      fi

      # Keep cargo target dir off the virtiofs mount — macOS Mach-O
      # aarch64-apple-darwin and Linux ELF x86_64/aarch64 targets share no
      # fingerprint but every write across the mount is slow.
      mkdir -p "${HOME}/.cargo-target-lima"

      # Shell rc — PATH + CARGO_TARGET_DIR. These must live in ~/.profile
      # rather than Lima's `env:` block because `${HOME}` and `${PATH}`
      # need shell expansion; /etc/environment does not expand variables.
      PROFILE="${HOME}/.profile"
      if ! grep -q "# overdrive-dev begin" "${PROFILE}" 2>/dev/null; then
        cat >> "${PROFILE}" <<'EOF'

      # overdrive-dev begin
      export CARGO_TARGET_DIR="${HOME}/.cargo-target-lima"
      export PATH="${HOME}/.cargo/bin:${HOME}/.local/bin:${PATH}"
      # overdrive-dev end
      EOF
      fi

# ────────────────────────────────────────────────────────────────────────────
# Probes — Lima waits for each to succeed before reporting "ready".
# ────────────────────────────────────────────────────────────────────────────
probes:
  - description: "rustup installed"
    script: |
      #!/usr/bin/env bash
      set -eu
      timeout 300 bash -c 'until command -v rustup >/dev/null 2>&1 \
        || [ -x "$HOME/.cargo/bin/rustup" ]; do sleep 2; done'
    hint: "Rustup did not install within 5 minutes."

  # The bpf-build / bpf-clippy jobs run `rustup run nightly cargo ...`
  # (the bpfel-unknown-none target needs `-Z build-std=core`, nightly-only).
  # The user-mode install above is `... || true`, and the "rustup installed"
  # probe only checks the rustup *binary* — so a swallowed nightly-install
  # failure would otherwise stay invisible until `rustup run nightly` fails
  # three CI steps later with a confusing "toolchain 'nightly' is not
  # installed". Gate readiness on the toolchain actually being present so a
  # failed install fails provisioning loudly, at the source.
  - description: "pinned BPF nightly toolchain installed (bpf-build needs it)"
    script: |
      #!/usr/bin/env bash
      set -eu
      export PATH="$HOME/.cargo/bin:$PATH"
      timeout 300 bash -c 'until rustup toolchain list 2>/dev/null \
        | grep -q "^nightly-2026-08-05"; do sleep 2; done'
    hint: "pinned BPF nightly toolchain missing — `rustup toolchain install nightly-2026-08-05` failed during user-mode provisioning (see the `mode: user` script; keep this date in sync with xtask::BPF_NIGHTLY_TOOLCHAIN)."

  - description: "cloud-hypervisor installed"
    script: |
      #!/usr/bin/env bash
      set -eu
      timeout 300 bash -c 'until [ -x /usr/local/bin/cloud-hypervisor ]; do sleep 2; done'
      /usr/local/bin/cloud-hypervisor --version
    hint: "Cloud Hypervisor binary missing — check provisioning log."

  - description: "wasmtime installed"
    script: |
      #!/usr/bin/env bash
      set -eu
      timeout 300 bash -c 'until command -v wasmtime >/dev/null 2>&1; do sleep 2; done'
      wasmtime --version
    hint: "Wasmtime binary missing — check provisioning log."

  - description: "pwru installed"
    script: |
      #!/usr/bin/env bash
      set -eu
      timeout 300 bash -c 'until command -v pwru >/dev/null 2>&1; do sleep 2; done'
      pwru --version
    hint: "pwru binary missing — check provisioning log."

  - description: "quint toolchain installed (quint on Node + JDK 21 + pre-fetched Apalache)"
    script: |
      #!/usr/bin/env bash
      set -eu
      timeout 300 bash -c 'until [ -x /usr/local/bin/quint ] \
        && [ -x /opt/quint-toolchain/quint-home/apalache-dist-{{ .Param.QUINT_APALACHE_VERSION }}/apalache/bin/apalache-mc ]; do sleep 2; done'
      quint --version
      java -version
    hint: "Quint toolchain missing — check the Quint provisioning step in /var/log/cloud-init-output.log."

  - description: "kraft (Unikraft) installed"
    script: |
      #!/usr/bin/env bash
      set -eu
      timeout 300 bash -c 'until command -v kraft >/dev/null 2>&1; do sleep 2; done'
    hint: "kraftkit .deb install failed — check /var/log/cloud-init-output.log"

  - description: "sccache installed"
    script: |
      #!/usr/bin/env bash
      set -eu
      timeout 300 bash -c 'until command -v sccache >/dev/null 2>&1 \
        || [ -x "$HOME/.cargo/bin/sccache" ]; do sleep 2; done'
    hint: "sccache binary missing — `cargo binstall sccache` failed in user-mode provisioning."

  - description: "KVM accessible"
    script: |
      #!/usr/bin/env bash
      set -eu
      test -c /dev/kvm
    hint: |
      /dev/kvm not present. Nested virt requires macOS 15+ and an M3/M4 or
      Intel host. Tier 3 integration tests will not run without it.

# ────────────────────────────────────────────────────────────────────────────
# Message shown after first boot.
# ────────────────────────────────────────────────────────────────────────────
message: |
  Overdrive dev VM ready.

  Installed:
    cloud-hypervisor   $(cloud-hypervisor --version 2>/dev/null || echo missing)
    wasmtime           $(wasmtime --version 2>/dev/null || echo missing)
    pwru               $(pwru --version 2>/dev/null || echo missing)
    quint              $(quint --version 2>/dev/null || echo missing)
    kraft              $(kraft version 2>/dev/null | head -n1 || echo missing)
    rustup             $(rustup --version 2>/dev/null | head -n1)
    qemu               $(qemu-system-$(uname -m) --version | head -n1)

  Next:
    limactl shell overdrive
    cd {{ .Dir }} && cargo build
