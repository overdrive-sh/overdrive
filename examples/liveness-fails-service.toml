[service]
id = "liveness-fails"
replicas = 1

[[listener]]
port = 8092
protocol = "tcp"

[vm]
command = "/opt/overdrive/examples/svm/e08-server"
args = ["--raw-port", "8092", "--http-port", "18080"]
kernel = "/srv/vm/overdrive-testing/svm-e08/kernel"
rootfs = "/srv/vm/overdrive-testing/svm-e08/rootfs.ext4"

[[health_check.startup]]
type = "tcp"
port = 8092
interval_seconds = 1
timeout_seconds = 1
max_attempts = 30

[[health_check.liveness]]
type = "tcp"
port = 9192
interval_seconds = 2
timeout_seconds = 1
failure_threshold = 2

[resources]
cpu_milli = 500
memory_bytes = 134217728
