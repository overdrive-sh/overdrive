# The `api` VM Service behind the public Route. The Route's
# `[route.target].service = "api"` is byte-equal to this logical id.
# `prepare.sh` materializes the fixed kernel, rootfs and guest binary paths.
[service]
id = "api"
replicas = 1

[[listener]]
port = 8080
protocol = "tcp"

[vm]
command = "/opt/overdrive/examples/pig/api-server"
args = []
kernel = "/srv/vm/overdrive-testing/pig-example/kernel"
rootfs = "/srv/vm/overdrive-testing/pig-example/rootfs.ext4"

[resources]
cpu_milli = 500
memory_bytes = 134217728

[[health_check.startup]]
type = "tcp"
host = "0.0.0.0"
port = 8080
interval_seconds = 1
timeout_seconds = 1
max_attempts = 30

[[health_check.readiness]]
type = "http"
path = "/ready"
port = 8080
interval_seconds = 1
timeout_seconds = 1
success_threshold = 1
