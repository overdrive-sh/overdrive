[service]
id = "gti-e07-callee"
replicas = 1

[vm]
command = "/opt/overdrive/examples/gti/e07-callee"
args = []
kernel = "/srv/vm/overdrive-testing/gti-e07/kernel"
rootfs = "/srv/vm/overdrive-testing/gti-e07/rootfs.ext4"

[resources]
cpu_milli = 500
memory_bytes = 134217728

[[listener]]
port = 18951
protocol = "tcp"

[health_check]
# The VM Service uses the checked-in guest caller as the health oracle; this
# explicit opt-out keeps the current host-originated inferred probe from
# claiming guest health before the VM path is connected.
startup = []
