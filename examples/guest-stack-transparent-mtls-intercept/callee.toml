[service]
id = "gti-e07-callee"
replicas = 1

[exec]
command = "/srv/vm/overdrive-testing/gti-e07/bin/e07-callee"
args = []

[resources]
cpu_milli = 250
memory_bytes = 67108864

[[listener]]
port = 18951
protocol = "tcp"

[health_check]
# The production probe runner cannot reach an allocation's network namespace.
# This explicit, supported opt-out prevents the known-unreachable inferred TCP
# startup probe; first Running is therefore immediately deployment-stable for
# this narrow example. The describe surface reports the allocation as Running.
startup = []
