# VM-backed UDP Service fixture for the current supported execution path.
[service]
id = "dns-resolver"
replicas = 1

[vm]
command = "/opt/overdrive/examples/svm/e08-server"
args = ["--udp-port", "15353"]
kernel = "/srv/vm/overdrive-testing/svm-e08/kernel"
rootfs = "/srv/vm/overdrive-testing/svm-e08/rootfs.ext4"

[resources]
cpu_milli = 500
memory_bytes = 134217728

[[listener]]
port = 15353
protocol = "udp"
