[job]
id = "service-vm-e08-client"

[vm]
command = "/opt/overdrive/examples/svm/e08-client"
args = ["service-vm-e08.svc.overdrive.local", "18081", "expect-reply", "raw"]
kernel = "/srv/vm/overdrive-testing/svm-e08/kernel"
rootfs = "/srv/vm/overdrive-testing/svm-e08/rootfs.ext4"

[resources]
cpu = "500m"
memory = "128MiB"
