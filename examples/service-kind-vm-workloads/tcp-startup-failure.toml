[service]
id = "service-vm-tcp-failure"
replicas = 1

[[listener]]
port = 18081
protocol = "tcp"

[vm]
command = "/opt/overdrive/examples/svm/e08-server"
args = []
kernel = "/srv/vm/overdrive-testing/svm-e08/kernel"
rootfs = "/srv/vm/overdrive-testing/svm-e08/rootfs.ext4"

[resources]
cpu_milli = 500
memory_bytes = 134217728

# The example server binds 18081; this deliberately-unbound guest port is the
# only load-bearing difference from the healthy TCP journey.
[[health_check.startup]]
type = "tcp"
host = "0.0.0.0"
port = 18999
interval_seconds = 1
timeout_seconds = 1
max_attempts = 3
