[service]
id = "service-vm-zero-declared-probes"
replicas = 1

[[listener]]
port = 18081
protocol = "tcp"

[vm]
command = "/opt/overdrive/examples/svm/e08-server"
args = []
kernel = "/srv/vm/overdrive-testing/svm-e08/kernel"
rootfs = "/srv/vm/overdrive-testing/svm-e08/rootfs.ext4"

[resources]
cpu_milli = 500
memory_bytes = 134217728

# No health_check table: D15 materializes one GuestListeners startup gate over
# every declared TCP and UDP listener, with a 60-second deadline. The Service
# becomes Stable when the guest reports its declared TCP/18081 listener open.
