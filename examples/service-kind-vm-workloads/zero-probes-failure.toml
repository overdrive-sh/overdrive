[service]
id = "service-vm-zero-declared-probes-failure"
replicas = 1

[[listener]]
port = 18998
protocol = "tcp"

[vm]
command = "/opt/overdrive/examples/svm/e08-server"
args = []
kernel = "/srv/vm/overdrive-testing/svm-e08/kernel"
rootfs = "/srv/vm/overdrive-testing/svm-e08/rootfs.ext4"

[resources]
cpu_milli = 500
memory_bytes = 134217728

# No health_check table: D15 materializes one GuestListeners startup gate over
# every declared TCP and UDP listener. This guest never reports its declared
# TCP/18998 listener open within 60 seconds, so it must stop, restart, and give
# up with StartupProbeFailed naming the missing listener.
